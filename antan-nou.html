async function adminHandleProposition(id, newStatus, uid) {
  try {
    await db.collection('propositions').doc(id).update({ status: newStatus });
    if (newStatus === 'approved') {
      if (uid) awardPoints(uid, 15);
      loadApprovedCommunityPlaces();
    }
    refreshAdminPendingList();
  } catch (e) {
    console.warn('Traitement de la proposition échoué :', e);
    alert(t('errGeneric'));
  }
}

// ==================== Fusion runtime des lieux communautaires approuvés ====================
// Convertit un document "propositions" approuvé au même format que PLACES
// (voir le commentaire sur ALL_PLACES plus haut), avec moment/acces par
// défaut puisque le formulaire de soumission ne les collecte pas, et un
// marqueur communautaire:true pour que l'UI puisse afficher le badge dédié.
function mapPropositionToPlace(id, d) {
  const place = {
    t: d.t, z: d.z, nom: d.nom, v: Array.isArray(d.v) ? d.v : [],
    typeKey: d.typeKey, desc: d.desc || '', budget: d.budget, duree: d.duree,
    moment: 'jour', acces: [], lat: d.lat, lng: d.lng, communautaire: true,
  };
  if (d.conseils) place.conseils = d.conseils;
  if (d.photoUrl) place.photoUrl = d.photoUrl;
  return place;
}
async function loadApprovedCommunityPlaces() {
  if (!FIREBASE_ENABLED || !db) return;
  try {
    const snap = await db.collection('propositions').where('status', '==', 'approved').get();
    communityPlaces = snap.docs
      .map(docSnap => mapPropositionToPlace(docSnap.id, docSnap.data()))
      // Garde-fou : un lieu communautaire mal formé (champs requis manquants)
      // ne doit jamais faire planter le rendu/la recherche/le mode Chasseur.
      .filter(p => p.t && p.z && p.typeKey && p.nom && Number.isFinite(p.lat) && Number.isFinite(p.lng));
    rebuildAllPlaces();
    // Ne re-render que si une vue affichant potentiellement des lieux est déjà
    // à l'écran, pour ne jamais perturber un formulaire en cours de saisie.
    if (step === 'home' || step === 3) render();
  } catch (e) {
    console.warn('Chargement des lieux communautaires échoué :', e);
  }
}

// ---- Fiche détail d'un lieu ----
function openPlaceDetail(p) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'placeOverlay';
  document.body.appendChild(overlay);
  // Arrête le suivi de distance en direct (section jeu ci-dessous) dès que la
  // fiche se ferme, par la croix ou en touchant hors de la modale — sinon
  // watchPosition continuerait de tourner en arrière-plan pour rien.
  overlay.onclick = e => { if (e.target === overlay) { stopGameDetailDistanceWatch(); overlay.remove(); } };
  const hasInfos = !!(p.tarif || p.budget !== 'gratuit' || p.difficulte || p.conseils || p.site);
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${p.nom}</h3><button class="modal-close" id="closePlace">✕</button></div>
    <div id="placePhotoWrap" class="photo-carousel">
      <div class="photo-slide"><span style="font-size:32px;">🌴</span></div>
    </div>
    <div id="placePhotoDots" class="photo-dots"></div>
    <p id="placePhotoCredit" style="font-size:10px; color:var(--muted); text-align:right; margin:2px 0 12px;"></p>
    <p class="loc" style="margin-bottom:10px;">${TERRITOIRES.find(x=>x.key===p.t).label} · ${p.z}</p>
    <p class="adv-label" style="margin-bottom:6px;">${t('pourquoiYAller')}</p>
    <p class="desc" style="margin-bottom:14px;">${placeDesc(p)}</p>
    <div class="vibes" style="margin-bottom:14px;">
      ${p.v.map(v => `<span class="chip-vibe">${VIBES.find(x=>x.key===v).e} ${t('vibe_'+v)}</span>`).join('')}
      <span class="chip-meta">${t('budget_'+p.budget)}</span>
      <span class="chip-meta">${t('duree_'+p.duree)}</span>
      ${p.communautaire ? `<span class="chip-meta" style="background:var(--brand-blue-soft); color:var(--brand-blue);">${t('communautaireBadge')}</span>` : ''}
    </div>
    ${hasInfos ? `<div class="infos-pratiques">
      <h4>${t('infosPratiquesTitle')}</h4>
      ${p.tarif || p.budget !== 'gratuit' ? `<div class="infos-row"><span class="ic">💰</span><span><b>${t('infosTarif')}</b><br>${p.tarif ? p.tarif : t('detailTarifUnknown')}</span></div>` : ''}
      ${p.difficulte ? `<div class="infos-row"><span class="ic">🥾</span><span><b>${t('infosDifficulte')}</b><br>${'●'.repeat(p.difficulte)}${'○'.repeat(5 - p.difficulte)} <span style="color:var(--muted);">${t('difficulte'+p.difficulte)}</span></span></div>` : ''}
      ${p.conseils ? `<div class="infos-row"><span class="ic">💡</span><span><b>${t('infosConseil')}</b><br>${p.conseils}</span></div>` : ''}
      ${p.site ? `<div class="infos-row"><span class="ic">📱</span><span><b>${t('infosContact')}</b><br><a href="${p.site}" target="_blank" rel="noopener" style="color:var(--brand-blue); font-weight:700;">${t('detailSite')}</a></span></div>` : ''}
    </div>` : ''}
    <a class="maps-btn" href="${mapsLink(p)}" target="_blank" rel="noopener" style="display:flex; justify-content:center; margin-bottom:10px;">${t('yAllerCta')}</a>
    <div class="day-card" style="margin-top:4px;">
      <p class="adv-label" style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
        <span>${t('avisTitle')}</span> <span id="avisAverage" style="font-weight:600;">…</span>
      </p>
      <div id="avisList" style="margin-bottom:10px;"><p class="step-sub">${t('avisLoading')}</p></div>
      <div id="avisFormBox"></div>
    </div>
    ${gameEnabled ? gameSectionHTML(p) : ''}
  </div>`;
  document.getElementById('closePlace').onclick = () => { stopGameDetailDistanceWatch(); overlay.remove(); };
  if (gameEnabled) bindGameSection(p);
  fetchPlacePhotos(p).then(photos => {
    const wrap = document.getElementById('placePhotoWrap');
    const dotsEl = document.getElementById('placePhotoDots');
    const credit = document.getElementById('placePhotoCredit');
    // Un lieu communautaire peut avoir sa propre photo (jointe à la proposition) :
    // on la place en tête du carrousel, avant les photos Wikimedia éventuelles.
    if (p.communautaire && p.photoUrl) photos = [{ url: p.photoUrl, page: null }, ...(photos || [])];
    if (wrap && photos && photos.length) {
      wrap.innerHTML = photos.map(ph => `<div class="photo-slide"><img src="${ph.url}" alt="${p.nom.replace(/"/g,'&quot;')}" loading="lazy"></div>`).join('');
      if (credit) credit.innerHTML = photos[0].page ? `<a href="${photos[0].page}" target="_blank" rel="noopener" style="color:var(--muted); text-decoration:none;">📷 ${photos[0].source || 'Wikimedia Commons'}</a>` : (photos[0].source ? `📷 ${photos[0].source}` : '');
      if (photos.length > 1 && dotsEl) {
        dotsEl.innerHTML = photos.map((_, i) => `<span class="${i===0?'active':''}"></span>`).join('');
        wrap.onscroll = () => {
          const idx = Math.min(photos.length - 1, Math.round(wrap.scrollLeft / wrap.clientWidth));
          dotsEl.querySelectorAll('span').forEach((d, i) => d.classList.toggle('active', i === idx));
          const ph = photos[idx];
          if (credit && ph) credit.innerHTML = ph.page ? `<a href="${ph.page}" target="_blank" rel="noopener" style="color:var(--muted); text-decoration:none;">📷 ${ph.source || 'Wikimedia Commons'}</a>` : (ph.source ? `📷 ${ph.source}` : '');
        };
      }
    } else if (wrap) {
      const vibeEmoji = p.v[0] ? (VIBES.find(x => x.key === p.v[0]) || {}).e : '🌴';
      wrap.innerHTML = `<div class="photo-slide"><span style="font-size:32px;">${vibeEmoji || '🌴'}</span></div>`;
    }
  });
  loadAvis(p);
  renderAvisForm(p);
}

const headerBrandEl = document.getElementById('headerBrand');
headerBrandEl.innerHTML = wordmarkSVG({width:112});
headerBrandEl.setAttribute('role', 'button');
headerBrandEl.setAttribute('tabindex', '0');
headerBrandEl.setAttribute('aria-label', t('navAccueil'));
headerBrandEl.style.cursor = 'pointer';
headerBrandEl.onclick = () => { collectionOverride = null; step = 'home'; render(); };
headerBrandEl.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); headerBrandEl.onclick(); } };
render();
updateFavBadge();
updateAccountIcon();
if (!lang) openLangModal(true);
// Ne bloque jamais le premier rendu : les lieux communautaires approuvés
// arrivent en tâche de fond et déclenchent leur propre re-render (voir
// loadApprovedCommunityPlaces()).
loadApprovedCommunityPlaces();

// Enregistrement du service worker : rend l'appli installable et utilisable
// hors-ligne UNE FOIS hébergée en ligne (https ou localhost). Ne fonctionne
// pas si le fichier est ouvert directement depuis le téléphone (file://).
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
