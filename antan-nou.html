<style>
  :root {
    --ink:#1B1A2E; --indigo:#2E2A5C; --indigo-soft:#EDEBF7;
    --coral:#F0654A; --coral-soft:#FDE4DE;
    --sand:#FBF8F2; --card:#FFFFFF; --line:#E7E3F0; --muted:#736F8C;
    --gold:#D9A441; --gold-soft:#FBF0DA;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; background:var(--sand); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header { padding:20px 20px 14px; }
  header .brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  header .brand { display:flex; align-items:center; gap:8px; }
  header .brand .mark { width:30px; height:30px; border-radius:9px; background:var(--indigo); display:flex; align-items:center; justify-content:center; font-size:15px; }
  header .brand .name { font-weight:800; font-size:15px; letter-spacing:-.01em; }
  header .icon-row { display:flex; gap:8px; }
  .icon-btn { position:relative; width:38px; height:38px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; }
  .icon-btn .badge { position:absolute; top:-5px; right:-5px; background:var(--coral); color:white; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(27,26,46,.55); display:flex; align-items:flex-end; z-index:1000; }
  .modal { background:var(--sand); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:20px; max-height:88vh; overflow-y:auto; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3 { margin:0; font-size:17px; font-weight:800; }
  .modal-close { width:30px; height:30px; border-radius:50%; background:var(--card); border:1px solid var(--line); font-size:14px; cursor:pointer; }
  .day-card { background:var(--card); border-radius:16px; border:1px solid var(--line); padding:14px; margin-bottom:12px; }
  .day-card h4 { margin:0 0 10px; font-size:14px; font-weight:800; color:var(--indigo); }
  .slot { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .slot:first-of-type { border-top:none; }
  .slot .when { flex:0 0 76px; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding-top:2px; }
  .slot .what .nom { font-size:13.5px; font-weight:700; margin:0; }
  .slot .what .z { font-size:11.5px; color:var(--muted); margin:1px 0 0; }
  .prog-form .adv-group { margin-bottom:16px; }
  .num-row { display:flex; gap:8px; }
  .num-opt { flex:1; text-align:center; padding:10px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); font-weight:700; font-size:14px; cursor:pointer; }
  .num-opt.sel { background:var(--indigo); border-color:var(--indigo); color:white; }
  .stepper { display:flex; gap:6px; }
  .stepper .dot { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .stepper .dot.done { background:var(--coral); }
  .step-title { font-size:20px; font-weight:800; margin:14px 0 4px; letter-spacing:-.01em; }
  .step-sub { font-size:13px; color:var(--muted); margin:0; }

  main { flex:1; padding:6px 20px 100px; overflow-y:auto; }

  .postcard-grid { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .postcard { border-radius:18px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; border:2px solid transparent; color:white; position:relative; }
  .postcard .stamp { font-size:26px; }
  .postcard .name { font-weight:800; font-size:15px; }
  .postcard.sel { border-color:var(--ink); }
  .postcard.sel::after { content:"✓"; position:absolute; right:14px; top:50%; transform:translateY(-50%); width:22px; height:22px; background:white; color:var(--ink); border-radius:50%; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; }

  .pill-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .pill { font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); cursor:pointer; }
  .pill.sel { background:var(--ink); border-color:var(--ink); color:white; }

  .vibe-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .vibe { aspect-ratio:1; border-radius:16px; background:var(--card); border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:11px; font-weight:700; color:var(--muted); text-align:center; padding:4px; }
  .vibe .e { font-size:22px; }
  .vibe.sel { background:var(--coral-soft); border-color:var(--coral); color:var(--coral); }

  .advanced-toggle { display:flex; align-items:center; justify-content:center; gap:6px; margin:20px 0 4px; padding:10px; border-radius:12px; border:1.5px dashed var(--line); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; }
  .advanced-panel { display:none; margin-top:14px; }
  .advanced-panel.open { display:block; }
  .adv-group { margin-bottom:16px; }
  .adv-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--muted); margin:0 0 8px; }
  .adv-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip-opt { font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); cursor:pointer; }
  .chip-opt.sel { background:var(--gold-soft); border-color:var(--gold); color:#8A6110; }

  .search-bar { display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; margin:14px 0 10px; }
  .search-bar input { border:none; outline:none; flex:1; font-size:14px; background:none; color:var(--ink); }
  .sort-row { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .sort-chip { flex:0 0 auto; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); color:var(--muted); cursor:pointer; white-space:nowrap; }
  .sort-chip.sel { background:var(--indigo); border-color:var(--indigo); color:white; }

  .results-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .results-head h2 { font-size:14px; margin:0; font-weight:800; }
  .results-head span { font-size:12px; color:var(--muted); }

  .place { background:var(--card); border-radius:18px; border:1px solid var(--line); padding:16px; margin-bottom:12px; position:relative; }
  .place .tab { position:absolute; top:-1px; left:16px; background:var(--indigo); color:white; font-size:10px; font-weight:800; padding:4px 10px; border-radius:0 0 8px 8px; letter-spacing:.03em; }
  .fav-btn { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:var(--sand); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; border:none; }
  .fav-btn.active { background:var(--coral-soft); }
  .place .nom { font-size:15.5px; font-weight:800; margin:14px 40px 2px 0; }
  .place .loc { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .place .desc { font-size:13px; line-height:1.45; margin:0 0 10px; color:#403C55; }
  .place .vibes { display:flex; gap:6px; flex-wrap:wrap; }
  .chip-vibe { font-size:10.5px; font-weight:700; background:var(--indigo-soft); color:var(--indigo); padding:3px 9px; border-radius:999px; }
  .chip-meta { font-size:10.5px; font-weight:700; background:var(--gold-soft); color:#8A6110; padding:3px 9px; border-radius:999px; }
  .maps-btn { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; color:white; background:var(--indigo); padding:6px 12px; border-radius:999px; text-decoration:none; margin-top:10px; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px; }
  .empty .e { font-size:34px; display:block; margin-bottom:10px; }

  nav.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; }
  .btn { flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; text-align:center; }
  .btn-primary { background:var(--ink); color:white; }
  .btn-primary:disabled { background:var(--line); color:var(--muted); }
  .btn-ghost { background:var(--sand); color:var(--ink); border:1px solid var(--line); flex:0 0 90px; }
</style>

let lang = localStorage.getItem('antan_nou_lang') || null;
function t(key) {
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.fr;
  return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.fr[key] !== undefined ? TRANSLATIONS.fr[key] : key);
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('antan_nou_lang', l); } catch(e){}
}
function openLangModal(forced) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'langOverlay';
  document.body.appendChild(overlay);
  if (!forced) overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${t('langPickerTitle')}</h3>${forced ? '' : '<button class="modal-close" id="closeLang">✕</button>'}</div>
    ${forced ? '' : `<p class="step-sub" style="margin-bottom:14px;">${t('langPickerSub')}</p>`}
    <div class="pill-wrap">${LANGS.map(l => `<div class="pill ${lang===l.key?'sel':''}" data-lang="${l.key}" style="font-size:15px; padding:12px 18px;">${l.flag} ${l.label}</div>`).join('')}</div>
  </div>`;
  if (!forced) document.getElementById('closeLang').onclick = () => overlay.remove();
  overlay.querySelectorAll('[data-lang]').forEach(el => {
    el.onclick = () => { setLang(el.dataset.lang); overlay.remove(); render(); };
  });
}

let selBudget = [], selDuree = [], selMoment = [], selAcces = [];
let searchQ = "";
let sortBy = "pertinence";

const FAV_KEY = "antan_nou_favoris_v1";
function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e){ return []; } }
function saveFavs(f) { localStorage.setItem(FAV_KEY, JSON.stringify(f)); }
let favoris = loadFavs();
function isFav(nom) { return favoris.includes(nom); }
function toggleFav(nom) {
  if (isFav(nom)) favoris = favoris.filter(n => n !== nom);
  else favoris.push(nom);
  saveFavs(favoris);
  syncFavorisToCloud();
  renderResults();
  updateFavBadge();
}
function updateFavBadge() {
  const b = document.getElementById('favBadge');
  if (favoris.length > 0) { b.style.display = 'flex'; b.textContent = favoris.length; }
  else { b.style.display = 'none'; }
}

// ---- Comptes (connexion / inscription / déconnexion) + synchronisation ----
function updateAccountIcon() {
  const btn = document.getElementById('openAccount');
  if (!btn) return;
  btn.textContent = currentUser ? '🟢' : '👤';
  btn.setAttribute('aria-label', currentUser ? 'Mon compte (connecté)' : 'Se connecter');
}

async function syncFavorisToCloud() {
  if (!FIREBASE_ENABLED || !currentUser) return;
  try { await db.collection('utilisateurs').doc(currentUser.uid).set({ favoris }, { merge:true }); }
  catch (e) { console.warn('Synchronisation des favoris échouée :', e); }
}

async function mergeFavorisFromCloud() {
  if (!FIREBASE_ENABLED || !currentUser) return;
  try {
    const doc = await db.collection('utilisateurs').doc(currentUser.uid).get();
    const cloudFavs = (doc.exists && Array.isArray(doc.data().favoris)) ? doc.data().favoris : [];
    favoris = Array.from(new Set([...favoris, ...cloudFavs]));
    saveFavs(favoris);
    await syncFavorisToCloud();
    updateFavBadge();
    if (step === 3) renderResults();
  } catch (e) { console.warn('Fusion des favoris échouée :', e); }
}

if (FIREBASE_ENABLED && auth) {
  auth.onAuthStateChanged(user => {
    currentUser = user;
    updateAccountIcon();
    if (user) mergeFavorisFromCloud();
  });
}

function traduireErreurFirebase(e) {
  const c = e && e.code;
  if (c === 'auth/email-already-in-use') return t('errEmailInUse');
  if (c === 'auth/invalid-email') return t('errInvalidEmail');
  if (c === 'auth/weak-password') return t('errWeakPassword');
  if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential') return t('errWrongCreds');
  return t('errGeneric');
}

function openAccountModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  }

  if (currentUser) {
    overlay.innerHTML = `<div class="modal">
      <div class="modal-head"><h3>${t('accountMyAccount')}</h3><button class="modal-close" id="closeAccount">✕</button></div>

      <button class="btn btn-ghost" id="logoutBtn" style="width:100%;">${t('accountLogout')}</button>
    </div>`;

    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('closeAccount').onclick = () => overlay.remove();
    document.getElementById('logoutBtn').onclick = () => { auth.signOut(); overlay.remove(); };
    return;
  }

  let mode = 'login';
  function renderForm() {
    overlay.innerHTML = `<div class="modal">
      <div class="modal-head"><h3>${mode === 'login' ? t('accountLoginTitle') : t('accountSignupTitle')}</h3><button class="modal-close" id="closeAccount">✕</button></div>
      <p class="step-sub" style="margin-bottom:14px;">${t('accountSub')}</p>
      <div class="prog-form">
        <div class="adv-group">
          <p class="adv-label">${t('accountEmail')}</p>
          <input type="email" id="accEmail" placeholder="${t('accountEmailPlaceholder')}" style="width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:14px;">
        </div>
        <div class="adv-group">
          <p class="adv-label">${t('accountPassword')}</p>
          <input type="password" id="accPass" placeholder="${t('accountPasswordPlaceholder')}" style="width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:14px;">
        </div>
        <p id="accError" style="color:var(--coral); font-size:12.5px; display:none; margin:0 0 12px;"></p>
      </div>
      <button class="btn btn-primary" id="accSubmit" style="width:100%; margin-bottom:10px;">${mode === 'login' ? t('accountLoginBtn') : t('accountCreateBtn')}</button>
      <button class="btn btn-ghost" id="accSwitch" style="width:100%;">${mode === 'login' ? t('accountNoAccount') : t('accountHasAccount')}</button>
    </div>`;
    document.getElementById('closeAccount').onclick = () => overlay.remove();
    document.getElementById('accSwitch').onclick = () => { mode = mode === 'login' ? 'signup' : 'login'; renderForm(); };
    document.getElementById('accSubmit').onclick = async () => {
      const email = document.getElementById('accEmail').value.trim();
      const pass = document.getElementById('accPass').value;
      const errEl = document.getElementById('accError');
      errEl.style.display = 'none';
      if (!email || !pass) { errEl.textContent = t('accountFillFields'); errEl.style.display = 'block'; return; }
      try {
        if (mode === 'login') await auth.signInWithEmailAndPassword(email, pass);
        else await auth.createUserWithEmailAndPassword(email, pass);
        overlay.remove();
      } catch (e) {
        errEl.textContent = traduireErreurFirebase(e);
        errEl.style.display = 'block';
      }
    };
  }
  document.body.appendChild(overlay);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  renderForm();
}
document.getElementById('openAccount').onclick = openAccountModal;
document.getElementById('openLang').onclick = () => openLangModal(false);

  const overlay = document.createElement('div');

  overlay.id = 'progOverlay';
  document.body.appendChild(overlay);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

      </div></div>

// Algorithme de composition : répartit les lieux filtrés sur des créneaux
// Matin / Après-midi / Soir par jour, selon la durée de chaque lieu.
function generateProgram() {
  let pool = PLACES.filter(p => {
    if (p.t !== progT) return false;
    if (progV.length && !p.v.some(v => progV.includes(v))) return false;
    if (progBudget.length && !progBudget.includes(p.budget)) return false;
    return true;
  });
  // mélange légèrement pour varier les propositions d'une génération à l'autre
  pool = pool.map(p => ({p, r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.p);

  const days = [];
  for (let d = 0; d < progDays; d++) days.push({ matin:null, apresmidi:null, soir:null });

  const used = new Set();
  for (const day of days) {
    for (const slot of ['matin','apresmidi','soir']) {
      if (day[slot]) continue;
      const candidate = pool.find(p => !used.has(p.nom) && (
        (slot === 'soir' && (p.moment === 'soir' || p.duree === 'rapide')) ||
        (slot !== 'soir' && p.moment !== 'soir')
      ) && p.duree !== 'journee');
      if (candidate) {
        day[slot] = candidate;
        used.add(candidate.nom);
        if (candidate.duree === 'demi-journee') {
          // occupe le créneau suivant du même jour si dispo
          const order = ['matin','apresmidi','soir'];
          const idx = order.indexOf(slot);
          const next = order[idx+1];
          if (next && !day[next]) day[next] = { ...candidate, linked:true };
        }
      }
    }
    // une sortie "journée entière" prend toute la journée si rien n'est encore casé
    if (!day.matin && !day.apresmidi && !day.soir) {
      const full = pool.find(p => !used.has(p.nom) && p.duree === 'journee');
      if (full) { day.matin = full; day.apresmidi = { ...full, linked:true }; used.add(full.nom); }
    }
  }
  return days;
}

function renderProgramResult(overlay) {
  const days = generateProgram();
  const labels = { matin:t('slotMatin'), apresmidi:t('slotApresmidi'), soir:t('slotSoir') };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${t('progResultTitle')}</h3><button class="modal-close" id="closeProg2">✕</button></div>
    <p class="step-sub" style="margin-bottom:16px;">${TERRITOIRES.find(t=>t.key===progT).label} · ${progDays}j</p>
    ${days.map((day, i) => `
      <div class="day-card">
        <h4>${t('progDay')}${i+1}</h4>
        ${['matin','apresmidi','soir'].map(slot => day[slot] ? `
          <div class="slot"><div class="when">${labels[slot]}</div><div class="what"><p class="nom">${day[slot].nom}${day[slot].linked ? ' (+)' : ''}</p><p class="z">${day[slot].z} · <a href="${mapsLink(day[slot])}" target="_blank" rel="noopener" style="color:var(--indigo); font-weight:700;">🧭 ${t('itineraire')}</a></p></div></div>
        ` : `<div class="slot"><div class="when">${labels[slot]}</div><div class="what"><p class="z">${t('progFree')}</p></div></div>`).join('')}
      </div>`).join('')}
    <button class="btn btn-ghost" id="regenProg" style="width:100%; margin-top:4px;">${t('progRegen')}</button>
  </div>`;
  document.getElementById('closeProg2').onclick = () => overlay.remove();
  document.getElementById('regenProg').onclick = () => renderProgramResult(overlay);
}


function setStep(n) { step = n; render(); }

function render() {
  ['d0','d1','d2','d3'].forEach((id,i) => {
    document.getElementById(id).className = 'dot' + (step > i ? ' done' : '');
  });
  const main = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  const title = document.getElementById('stepTitle');
  const sub = document.getElementById('stepSub');

  if (step === 0) {
    title.textContent = t('step0Title');
    sub.textContent = t('step0Sub');
    main.innerHTML = `<div class="postcard-grid">${TERRITOIRES.map(t => `
      <div class="postcard ${selT===t.key?'sel':''}" data-t="${t.key}" style="background:${t.grad};">
        <span class="stamp">${t.stamp}</span><span class="name">${t.label}</span>
      </div>`).join('')}</div>`;
    main.querySelectorAll('.postcard').forEach(el => {
      el.onclick = () => { selT = el.dataset.t; selZ = null; setStep(1); };
    });
    nav.innerHTML = '';
    return;
  }

  if (step === 1) {
    title.textContent = t('step1Title');
    sub.textContent = TERRITOIRES.find(x=>x.key===selT).label;
    main.innerHTML = `<div class="pill-wrap">
      <div class="pill ${selZ===null?'sel':''}" data-z="">${t('zoneAll')}</div>
      ${ZONES[selT].map(z => `<div class="pill ${selZ===z?'sel':''}" data-z="${z}">${z}</div>`).join('')}
    </div>`;
    main.querySelectorAll('.pill').forEach(el => {
      el.onclick = () => { selZ = el.dataset.z || null; setStep(2); };
    });
    nav.innerHTML = `<button class="btn btn-ghost" id="back">${t('back')}</button><button class="btn btn-primary" disabled>${t('chooseZone')}</button>`;
    document.getElementById('back').onclick = () => setStep(0);
    return;
  }

  if (step === 2) {
    title.textContent = t('step2Title');
    sub.textContent = t('step2Sub');
    main.innerHTML = `
      <div class="vibe-grid">${VIBES.map(v => `
        <div class="vibe ${selV.includes(v.key)?'sel':''}" data-v="${v.key}"><span class="e">${v.e}</span><span>${t('vibe_'+v.key)}</span></div>`).join('')}
      </div>
      <div class="advanced-toggle" id="advToggle">${advOpen?'▲':'▼'} ${t('moreOptions')}</div>
      <div class="advanced-panel ${advOpen?'open':''}" id="advPanel">
        <div class="adv-group"><p class="adv-label">${t('budgetGroupLabel')}</p><div class="adv-row">${BUDGETS.map(([k]) => `<div class="chip-opt ${selBudget.includes(k)?'sel':''}" data-group="budget" data-k="${k}">${t('budget_'+k)}</div>`).join('')}</div></div>
        <div class="adv-group"><p class="adv-label">${t('dureeGroupLabel')}</p><div class="adv-row">${DUREES.map(([k]) => `<div class="chip-opt ${selDuree.includes(k)?'sel':''}" data-group="duree" data-k="${k}">${t('duree_'+k)}</div>`).join('')}</div></div>
        <div class="adv-group"><p class="adv-label">${t('momentGroupLabel')}</p><div class="adv-row">${MOMENTS.map(([k]) => `<div class="chip-opt ${selMoment.includes(k)?'sel':''}" data-group="moment" data-k="${k}">${t('moment_'+k)}</div>`).join('')}</div></div>
        <div class="adv-group"><p class="adv-label">${t('accesGroupLabel')}</p><div class="adv-row">${ACCES.map(([k]) => `<div class="chip-opt ${selAcces.includes(k)?'sel':''}" data-group="acces" data-k="${k}">${t('acces_'+k)}</div>`).join('')}</div></div>
      </div>`;
    main.querySelectorAll('.vibe').forEach(el => {
      el.onclick = () => {
        const k = el.dataset.v;
        if (selV.includes(k)) selV = selV.filter(x => x !== k); else selV.push(k);
        render();
      };
    });
    document.getElementById('advToggle').onclick = () => { advOpen = !advOpen; render(); };
    main.querySelectorAll('.chip-opt').forEach(el => {
      el.onclick = () => {
        const k = el.dataset.k, g = el.dataset.group;
        const map = { budget:'selBudget', duree:'selDuree', moment:'selMoment', acces:'selAcces' };
        const arrName = map[g];
        window[arrName]; // no-op reference guard
        if (g==='budget') selBudget = selBudget.includes(k) ? selBudget.filter(x=>x!==k) : [...selBudget,k];
        if (g==='duree') selDuree = selDuree.includes(k) ? selDuree.filter(x=>x!==k) : [...selDuree,k];
        if (g==='moment') selMoment = selMoment.includes(k) ? selMoment.filter(x=>x!==k) : [...selMoment,k];
        if (g==='acces') selAcces = selAcces.includes(k) ? selAcces.filter(x=>x!==k) : [...selAcces,k];
        render();
      };
    });
    nav.innerHTML = `<button class="btn btn-ghost" id="back">${t('back')}</button><button class="btn btn-primary" id="go">${t('seeOutings')}</button>`;
    document.getElementById('back').onclick = () => setStep(1);
    document.getElementById('go').onclick = () => setStep(3);
    return;
  }

  if (step === 3) {
    title.textContent = t('step3Title');
    sub.textContent = TERRITOIRES.find(x=>x.key===selT).label + (selZ ? ' · ' + selZ : '');
    main.innerHTML = `
      <div class="search-bar">🔎 <input type="text" id="searchInput" placeholder="${t('searchPlaceholder')}" value="${searchQ}"></div>
      <div class="sort-row">
        <div class="sort-chip ${sortBy==='pertinence'?'sel':''}" data-s="pertinence">${t('sortPertinence')}</div>
        <div class="sort-chip ${sortBy==='alpha'?'sel':''}" data-s="alpha">${t('sortAlpha')}</div>
        <div class="sort-chip ${sortBy==='favoris'?'sel':''}" data-s="favoris">${t('sortFavoris')}</div>
      </div>
      <div class="results-head"><h2>${t('resultsTitle')}</h2><span id="resCount"></span></div>
      <div id="resultsList"></div>`;
    document.getElementById('searchInput').oninput = (e) => { searchQ = e.target.value; renderResults(); };
    main.querySelectorAll('.sort-chip').forEach(el => { el.onclick = () => { sortBy = el.dataset.s; render(); }; });
    nav.innerHTML = `<button class="btn btn-ghost" id="back">${t('back')}</button><button class="btn btn-primary" id="restart">${t('newSearch')}</button>`;
    document.getElementById('back').onclick = () => setStep(2);
    document.getElementById('restart').onclick = () => { selT=null; selZ=null; selV=[]; selBudget=[]; selDuree=[]; selMoment=[]; selAcces=[]; searchQ=''; sortBy='pertinence'; setStep(0); };
    renderResults();
    return;
  }
}

function renderResults() {
  let results = PLACES.filter(p => {
    if (p.t !== selT) return false;
    if (selZ && p.z !== selZ) return false;
    if (selV.length && !p.v.some(v => selV.includes(v))) return false;
    if (selBudget.length && !selBudget.includes(p.budget)) return false;
    if (selDuree.length && !selDuree.includes(p.duree)) return false;
    if (selMoment.length && !selMoment.includes(p.moment)) return false;
    if (selAcces.length && !selAcces.every(a => p.acces.includes(a))) return false;
    if (searchQ.trim() && !p.nom.toLowerCase().includes(searchQ.trim().toLowerCase())) return false;
    return true;
  });
  if (sortBy === 'alpha') results = results.slice().sort((a,b) => a.nom.localeCompare(b.nom));
  if (sortBy === 'favoris') results = results.filter(p => isFav(p.nom));

  document.getElementById('resCount').textContent = results.length + ' ' + (results.length>1?t('resultPlural'):t('resultSingular'));
  const budgetLabel = k => t('budget_'+k);
  const dureeLabel = k => t('duree_'+k);
  document.getElementById('resultsList').innerHTML = results.length === 0
    ? `<div class="empty"><span class="e">🌴</span>${sortBy==='favoris' ? t('emptyFavoris') : t('emptyResults')}</div>`
    : results.map(p => `
      <div class="place">
        <span class="tab">${p.z}</span>
        <button class="fav-btn ${isFav(p.nom)?'active':''}" data-nom="${p.nom.replace(/"/g,'&quot;')}">${isFav(p.nom)?'❤️':'🤍'}</button>
        <p class="nom">${p.nom}</p>
        <p class="desc">${p.desc}</p>
        <div class="vibes">
          ${p.v.map(v => `<span class="chip-vibe">${VIBES.find(x=>x.key===v).e} ${t('vibe_'+v)}</span>`).join('')}
          <span class="chip-meta">${budgetLabel(p.budget)}</span>
          <span class="chip-meta">${dureeLabel(p.duree)}</span>
          ${p.tarif ? `<span class="chip-meta">💶 ${p.tarif}</span>` : ''}
        </div>
        <a class="maps-btn" href="${mapsLink(p)}" target="_blank" rel="noopener">🧭 ${t('itineraire')}</a>
      </div>`).join('');
  document.querySelectorAll('.fav-btn').forEach(el => { el.onclick = () => toggleFav(el.dataset.nom); });
}

render();
updateFavBadge();
updateAccountIcon();
if (!lang) openLangModal(true);

// Enregistrement du service worker : rend l'appli installable et utilisable
// hors-ligne UNE FOIS hébergée en ligne (https ou localhost). Ne fonctionne
// pas si le fichier est ouvert directement depuis le téléphone (file://).
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
