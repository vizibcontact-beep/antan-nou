  "La Ferme Ti Bou": { en:"Family leisure park in Petit-Bourg: pool, water games, inflatables, pedal karting and a farm visit.", es:"Parque de ocio familiar en Petit-Bourg: piscina, juegos acuáticos, hinchables, karts a pedales y visita a la granja.", cr:"Pak lwazi fanmi Ti-Bou : pisin, jé dlo, gonfléyab, kart a pédal èk vizit an pak zannimo." },
  "Salines de Montjoly": { en:"Protected natural site in Rémire-Montjoly combining salt lagoons and a plateau, rich in birdlife and unusual for French Guiana's landscapes.", es:"Sitio natural protegido en Rémire-Montjoly que combina lagunas saladas y una meseta, rico en aves y atípico para los paisajes de la Guayana.", cr:"Plas natirèl pwotéjé Rémire-Montjoly ki mélanjé lagon sale ek an plato, plen zwézo ek diferan pou peyizaj Lagwiyàn." },
  "Baie de l'Embouchure": { en:"Shallow, windy lagoon near Orient Bay, a nature reserve popular with kitesurfers and windsurfers.", es:"Laguna poco profunda y ventosa cerca de Orient Bay, reserva natural popular entre los aficionados al kitesurf y windsurf.", cr:"Lagon pa fon ek plen van toupré Orient Bay, an rézèv natirèl kitesèf ek plans a vwal ka renmen." },
  "Cachot de Cyparis": { en:"Remains of the Saint-Pierre prison where one prisoner survived, almost alone, the 1902 eruption of Mount Pelée.", es:"Restos de la prisión de Saint-Pierre donde un prisionero sobrevivió, casi solo, a la erupción de la Montaña Pelée en 1902.", cr:"Ren prizon Sen-Pyè-a kote an prizonyé rété vivan, prèské tousèl, lè Montany Pelé pété an 1902." },
  "Bibliothèque Schœlcher": { en:"Belle Époque library with Byzantine-Egyptian decor, donated by Victor Schœlcher to the city of Fort-de-France.", es:"Biblioteca Belle Époque con decoración bizantino-egipcia, donada por Victor Schœlcher a la ciudad de Fort-de-France.", cr:"Bibliyotèk Bèl Epok ak dékorasyon bizanten-ejipsyen, Victor Schœlcher ba lavil Fodfrans." },
  "Tombolo de Sainte-Marie": { en:"Natural sandbar connecting the mainland to Îlet Sainte-Marie, visible at low tide.", es:"Franja de arena natural que conecta tierra firme con el islote Sainte-Marie, visible con marea baja.", cr:"An bann sab natirèl ki ka mennen jistan an Ilé Sent-Mari, ou ka wè'y lè lanmè ba." },
  "Anse Trabaud": { en:"Wild, windy beach on the Atlantic coast, prized for its unspoiled setting between sea and vegetation.", es:"Playa salvaje y ventosa en la costa atlántica, apreciada por su entorno virgen entre mar y vegetación.", cr:"Plaj sovaj ek ki ni van bò kot Atlantik-la, moun ka renmen bel kad li ant lanmè ek raje." },
  "Pointe de la Grande Vigie": { en:"The northernmost point of Guadeloupe, spectacular limestone cliffs plunging into the ocean.", es:"El punto más septentrional de Guadalupe, espectaculares acantilados calcáreos que caen al océano.", cr:"Pwent pli nò Gwadloup, gran falèz kalkè ki ka tonbé dwèt an lanmè." },
  "Place de la Victoire": { en:"Shaded historic square in Pointe-à-Pitre, lined with colonial buildings and gazebos.", es:"Plaza histórica sombreada en Pointe-à-Pitre, bordeada de edificios coloniales y quioscos.", cr:"Plas istorik lonbrajé Pwentapit, bòdé ak bèl kaz kolonyal ek kyòsk." },
  "Anse Crawen": { en:"Small, secluded naturist beach on Terre-de-Haut, reached by a coastal trail.", es:"Pequeña playa naturista y aislada en Terre-de-Haut, a la que se llega por un sendero costero.", cr:"Ti plaj izolé naturis Tè-d'An-O, ou rivé la pa an chimen bò kot-la." },
  "Habitation Loyola": { en:"Former Jesuit estate in Rémire-Montjoly, an easy trail where agoutis and monkeys often roam free.", es:"Antigua hacienda jesuita en Rémire-Montjoly, un sendero fácil donde a menudo se ven agutíes y monos en libertad.", cr:"Ansyen labitasyon jézuit Rémire-Montjoly, an chimen fasil kote ou ka souvan wè agouti ek makak an libèté." },
  "Îlet la Mère": { en:"Island reachable by boat from Cayenne, beaches, colonial ruins and dolphins often spotted along the way.", es:"Isla accesible en barco desde Cayena, playas, ruinas coloniales y delfines que suelen verse en el trayecto.", cr:"Ti lil ou rivé la an batiman apati Kayenn, plaj, ren kolonyal ek souvan dofen ou ka wè an chimen." },
  "Cupecoy": { en:"Beach lined with limestone cliffs and small caves, one of the island's most photogenic spots on the Dutch side.", es:"Playa bordeada de acantilados calcáreos y pequeñas cuevas, uno de los lugares más fotogénicos de la isla en el lado holandés.", cr:"Plaj bòdé ak falèz kalkè ek ti twou wòch, yonn adan pli fotojénik plas lil-la kòté olandé-a." },
  "Anse Marcel": { en:"Quiet beach nestled in a sheltered bay with a marina, in the island's north-east.", es:"Playa tranquila enclavada en una bahía protegida con marina, al noreste de la isla.", cr:"Plaj trankil an fon an bé pwotéjé ak an marina, nan nò-lès lil-la." },
  "Petit Cul-de-Sac": { en:"Sheltered, quiet beach in a lagoon next to Grand Cul-de-Sac, calm waters ideal for relaxed swimming.", es:"Playa protegida y tranquila en una laguna junto a Grand Cul-de-Sac, aguas calmas ideales para nadar sin prisas.", cr:"Plaj pwotéjé ek trankil an an lagon toupré Grand Cul-de-Sac, dlo trankil bon pou benyen dousman." },
  "Anse Couleuvre": { en:"Wild beach in the north reached by a forest trail, starting point of the hike to Grand'Rivière.", es:"Playa salvaje del norte a la que se llega por un sendero forestal, punto de partida de la caminata hacia Grand'Rivière.", cr:"Plaj sovaj nan nò-a, ou rivé la pa an chimen forè, kote yo ka pati pou Grand'Rivière apyé." },
  "Grand'Rivière": { en:"Isolated fishing village at the northern tip of the island, nicknamed Martinique's \"end of the world\", facing Dominica.", es:"Aislado pueblo de pescadores en el extremo norte de la isla, apodado el \"fin del mundo\" de Martinica, frente a Dominica.", cr:"Ti vilaj péchè izolé tout o nò lil-la, yo ka rélé'y \"bout mond\" Matinik-la, anfas Dominik." },
  "Saut du Gendarme": { en:"Small waterfall and natural pool reached by a short walk from l'Ajoupa-Bouillon.", es:"Pequeña cascada y piscina natural a la que se llega con una corta caminata desde l'Ajoupa-Bouillon.", cr:"Ti kaskad ek basen natirèl ou rivé la ak an ti maché apati l'Ajoupa-Bouillon." },
  "Habitation Zévallos": { en:"Ruins of a 19th-century sugar estate in Le Moule, known for its metal architecture and nickname \"haunted house\".", es:"Ruinas de una hacienda azucarera del siglo XIX en Le Moule, conocida por su arquitectura metálica y su apodo \"casa embrujada\".", cr:"Ren an ansyen labitasyon sik diznévyèm syèk Moul-la, koni pou achitekti métal li ek non yo ba'y \"kaz jenndyab\"." },
  "Cimetière de Morne-à-l'Eau": { en:"Black-and-white checkerboard cemetery on a hillside, one of the most photographed in the Caribbean, especially around All Saints' Day.", es:"Cementerio en damero blanco y negro en una ladera, uno de los más fotografiados del Caribe, especialmente en Todos los Santos.", cr:"Simityè damyé nwè épi blan anlè an mòn, yonn adan pli fotografyé Karayib-la, sitou pou fèt Latousen." },
  "Musée Saint-John Perse": { en:"19th-century bourgeois house in Pointe-à-Pitre devoted to the life and work of Nobel Prize-winning Guadeloupean poet Saint-John Perse.", es:"Casa burguesa del siglo XIX en Pointe-à-Pitre dedicada a la vida y obra del poeta guadalupeño ganador del Nobel Saint-John Perse.", cr:"Kaz bouwjwa diznévyèm syèk Pwentapit ki dédyé a lavi ek zèv powèt gwadloupéyen ki gannyen Nobèl-la, Saint-John Perse." },
  "Réserve naturelle Trésor": { en:"Forest reserve in Roura with an easy boardwalk trail, ideal for observing Amazonian biodiversity as a family.", es:"Reserva forestal en Roura con un sendero de pasarela fácil, ideal para observar la biodiversidad amazónica en familia.", cr:"Rézèv forè Roura ak an chimen planch fasil, bon pou wè bèl bèt ek plant amazonyen an fanmi." },
  "Mont Grand Matoury": { en:"Wooded nature reserve just outside Cayenne, several hiking trails through tropical forest.", es:"Reserva natural boscosa a las afueras de Cayena, varios senderos por el bosque tropical.", cr:"Rézèv natirèl bwazé toupré Kayenn, plizyè chimen an mitan forè tropikal-la." },
  "Zoo de Guyane": { en:"Animal park in Macouria dedicated to Amazonian wildlife: jaguars, monkeys, caimans and tropical birds.", es:"Parque animal en Macouria dedicado a la fauna amazónica: jaguares, monos, caimanes y aves tropicales.", cr:"Pak zannimo Macouria dédyé a bèt Amazoni-a : jagwa, makak, kayiman ek zwézo tropikal." },
  "Mullet Bay": { en:"Large beach lined by an 18-hole golf course, with calm waters popular for family swimming.", es:"Gran playa bordeada por un campo de golf de 18 hoyos, con aguas tranquilas populares para nadar en familia.", cr:"Gran plaj bòdé ak an tèren golf 18 twou, dlo trankil bon pou benyen an fanmi." },
  "Grand Cul-de-Sac": { en:"Calm, shallow lagoon protected by a coral reef, ideal for windsurfing, kitesurfing and family swimming.", es:"Laguna tranquila y poco profunda protegida por un arrecife de coral, ideal para windsurf, kitesurf y baño en familia.", cr:"Lagon trankil ek pa fon, pwotéjé pa an baryè koray, bon pou plans a vwal, kitesèf ek benyen an fanmi." },
  "Anse Mitan": { en:"Lively beach in Trois-Îlets, facing Fort-de-France, lined with restaurants and beach bars.", es:"Playa animada en Trois-Îlets, frente a Fort-de-France, bordeada de restaurantes y bares de playa.", cr:"Plaj anniméyé Twa-Zilé, anfas Fodfrans, bòdé ak restoran ek ba plaj." },
  "Grande Anse d'Arlet": { en:"Calm, shallow beach known for swimming with sea turtles just a few metres from shore.", es:"Playa tranquila y poco profunda conocida por nadar con tortugas marinas a pocos metros de la orilla.", cr:"Plaj trankil ek pa fon, koni pou nagé ak tòti lanmè touprè bò-a." },
  "Cap Chevalier": { en:"Atlantic coast beach known for its islets reachable on foot at low tide and ideal kitesurfing conditions.", es:"Playa de la costa atlántica conocida por sus islotes accesibles a pie con marea baja y condiciones ideales para kitesurf.", cr:"Plaj kot Atlantik-la, koni pou ti zilé ou pé rivé apyé lè lanmè ba, ek bon kondisyon pou kitesèf." },
  "Tartane": { en:"Colourful fishing village at the foot of the Caravelle peninsula, authentic atmosphere and well-known local waffles.", es:"Colorido pueblo de pescadores al pie de la península de la Caravelle, ambiente auténtico y famosos gofres locales.", cr:"Ti vilaj péchè koulè bò presqu'île Caravelle-la, bon anbyans ek gòfr lokal ki koni." },
  "Fort Delgrès": { en:"Historic fortification overlooking Basse-Terre, a major site of Louis Delgrès' resistance against the restoration of slavery in 1802.", es:"Fortificación histórica que domina Basse-Terre, lugar clave de la resistencia de Louis Delgrès contra el restablecimiento de la esclavitud en 1802.", cr:"Fò istorik anlè Bastè, gran plas rézistans Louis Delgrès kont ritabli lesklavaj an 1802." },
  "Allée Dumanoir": { en:"Road lined with a century-old row of royal palm trees, one of the most photographed sites in Guadeloupe.", es:"Carretera bordeada por una hilera centenaria de palmeras reales, uno de los lugares más fotografiados de Guadalupe.", cr:"Rout bòdé ak an alinyman santnè palmyé wayal, yonn adan pli fotografyé plas Gwadloup." },
  "Porte d'Enfer": { en:"Calm lagoon framed by spectacular cliffs battered by the ocean, in the north of Grande-Terre.", es:"Laguna tranquila enmarcada por acantilados espectaculares golpeados por el océano, al norte de Grande-Terre.", cr:"Lagon trankil antouré ak falèz espektakilè lanmè ka bat, nan nò Grande-Terre." },
  "Plage des Hattes": { en:"Awala-Yalimapo beach known for leatherback turtle nesting, the largest sea turtles in the world.", es:"Playa de Awala-Yalimapo conocida por la puesta de huevos de tortugas laúd, las tortugas marinas más grandes del mundo.", cr:"Plaj Awala-Yalimapo ki koni pou tòti-lit ka vin ponn, pli gran tòti lanmè an mond-la." },
  "Baie Longue": { en:"One of the island's longest and most beautiful beaches, pristine white sand and turquoise waters in Terres Basses.", es:"Una de las playas más largas y bellas de la isla, arena blanca inmaculada y aguas turquesas en Terres Basses.", cr:"Yonn adan pli long ek pli bel plaj lil-la, sab blan immakilé ek dlo tikwaz Terres Basses." },
  "Toiny": { en:"Wild coastline pounded by waves, one of the island's most renowned surf spots, for experienced surfers only.", es:"Costa salvaje golpeada por las olas, uno de los spots de surf más famosos de la isla, solo para surfistas experimentados.", cr:"Kot sovaj lanmè ka bat, yonn adan pli koni spot sèf lil-la, sèlman pou sèfè eksperimanté." },
  "Grande Anse des Salines": { en:"The most famous beach in the south, fine sand and coconut trees.", es:"La playa más famosa del sur, arena fina y cocoteros.", cr:"Laplaj pli renonmé an sid-la, sab fen ek pyé koko." },
  "Rocher du Diamant": { en:"Iconic islet facing a long sandy beach.", es:"Islote emblemático frente a una larga playa de arena.", cr:"Ti lil ki koni anfas an gran plaj sab." },
  "Les Anses-d'Arlet": { en:"Fishing village with small, quiet beaches.", es:"Pueblo de pescadores con pequeñas playas tranquilas.", cr:"Vilaj péchè ek ti plaj trankil." },
  "Bars de plage de Sainte-Anne": { en:"Lively seaside atmosphere, especially in the evening.", es:"Ambiente festivo junto al mar, sobre todo por la noche.", cr:"Anbyans fèt bò lanmè, sitou lasswè." },
  "Fort Saint-Louis": { en:"Historic fortress overlooking Fort-de-France bay.", es:"Fortificación histórica que domina la bahía de Fort-de-France.", cr:"Fò istorik ki ka domine bé Fò-di-Frans." },
  "Marché couvert de Fort-de-France": { en:"Spices, fruit and local crafts right in the city center.", es:"Especias, frutas y artesanía local en pleno centro.", cr:"Zépis, fwi ek atizana lokal an plen sant-vil." },
  "Habitation Clément": { en:"Historic estate and aged rum distillery, with gardens.", es:"Finca histórica y destilería de ron añejo, con jardines.", cr:"Bitasyon istorik ek distilri wonm vyé, ak jaden." },
  "Gorges de la Falaise": { en:"Water hike through a narrow canyon.", es:"Senderismo acuático por un cañón estrecho.", cr:"Rando nan dlo adan an gòj sèré." },
  "Montagne Pelée": { en:"Climb up the north's iconic volcano.", es:"Ascenso al volcán emblemático del norte.", cr:"Monté volkan koni nan nò-a." },
  "Plage du Carbet": { en:"Black sand beach at the foot of Le Carbet, steeped in history.", es:"Playa de arena negra al pie de Carbet, cargada de historia.", cr:"Plaj sab nwè o pyé Kabé, plen istwa." },
  "Réserve naturelle de la Caravelle": { en:"Protected peninsula with coastal trails and historic ruins.", es:"Península protegida con senderos costeros y ruinas históricas.", cr:"Prèskil pwotéjé, chimen bò lanmè ek rwin istorik." },
  "Cascades d'Absalon": { en:"Warm-water pools and an easy forest trail.", es:"Piscinas de agua tibia y un sendero forestal fácil.", cr:"Basen dlo cho ek an ti chimen an bwa fasil." },
  "Distillerie Saint James": { en:"Martinique's oldest agricultural rum brand, with an on-site museum.", es:"La marca de ron agrícola más antigua de Martinica, con museo in situ.", cr:"Pli ansyen mak wonm agrikol Matinik, ak an mizé asou plas-la." },
  "Jardin de Balata": { en:"Remarkable tropical garden in the hills above Fort-de-France.", es:"Notable jardín tropical en las alturas de Fort-de-France.", cr:"Bel jaden twopikal anlè Fò-di-Frans." },
  "Zoo de Martinique (Habitation Latouche)": { en:"Tropical zoo in Le Carbet, set on a former plantation.", es:"Zoológico tropical en Le Carbet, en una antigua hacienda.", cr:"Zoo twopikal Kabé, asou an ansyen bitasyon." },
  "Lolos de la Grande Anse des Salines": { en:"Beach shacks serving grilled fish and smoked chicken by the sea.", es:"Cabañas de playa que sirven pescado a la parrilla y pollo ahumado frente al mar.", cr:"Ti kabann bò plaj ka sèvi pwason gwiyé ek poulé boukané fasafas lanmè." },
  "La Savane des Esclaves": { en:"A walk retracing traditional creole life: kalinago village, traditional huts, creole and medicinal garden.", es:"Recorrido que recrea la vida criolla tradicional: aldea kalinago, cabañas tradicionales, jardín criollo y medicinal.", cr:"An chimen ki ka montré lavi kréyòl dantan : vilaj kalinago, kaz tradisyonèl, jaden kréyòl é médisinal." },
  "Distillerie Neisson": { en:"Small family-run distillery in Le Carbet, organic AOC agricultural rum, free or guided visit.", es:"Pequeña destilería familiar en Le Carbet, ron agrícola AOC ecológico, visita libre o guiada.", cr:"Ti distilri fanmi Kabé, wonm agrikol AOC bio, vizit lib gratis oben gidé." },
  "Village de la Poterie (Trois-Îlets)": { en:"Former colonial pottery converted into a village of local craft shops — ceramics, Creole fashion, decor items.", es:"Antigua alfarería colonial convertida en un pueblo de tiendas de artesanía local — cerámica, moda criolla, decoración.", cr:"Ansyen potri kolonyal ki vin an vilaj boutik atizana lokal — sérami, mòd kréyòl, dékorasyon." },
  "La Galleria (Le Lamentin)": { en:"Martinique's largest shopping mall, around a hundred shops, restaurants and a cinema.", es:"El centro comercial más grande de Martinica, un centenar de tiendas, restaurantes y un cine.", cr:"Pli gran sant komèsyal Matinik, anviwon san boutik, restoran ek an sinéma." },
  "Musée d'archéologie et de préhistoire": { en:"Collections tracing Martinique's Amerindian civilizations before European arrival.", es:"Colecciones que retratan las civilizaciones amerindias de Martinica antes de la llegada europea.", cr:"Koleksyon ki ka montré sivilizasyon Endyen Matinik avan Ewopéyen rivé." },
  "Madinina Kayak Tripping": { en:"Kayak trips from Le Vauclin, through mangroves and islets on the south Atlantic coast.", es:"Salidas en kayak desde Le Vauclin, entre manglares e islotes de la costa atlántica sur.", cr:"Balad kayak apati Vòklen, adan mangwòv ek zilé bò lanmè atlantik sid-la." },
  "Anse Dufour": { en:"Small cove in Les Anses-d'Arlet, well known for swimming with sea turtles.", es:"Pequeña cala en Les Anses-d'Arlet, conocida por nadar con tortugas marinas.", cr:"Ti kriké Ansdalè, koni pou nagé ek tòti lanmè." },
  "Anse Noire": { en:"Volcanic black-sand beach nestled between cliffs, right next to Anse Dufour.", es:"Playa de arena negra volcánica entre acantilados, justo al lado de Anse Dufour.", cr:"Plaj sab nwè volkanik ant fal wòch, jis akoté Ans Dufour." },
  "Plage de Bois Jolan": { en:"Long family-friendly beach lined with casuarina trees.", es:"Larga playa familiar bordeada de casuarinas.", cr:"Long plaj bon pou fanmi, bòdé ak pyé filao." },
  "Pointe des Châteaux": { en:"Spectacular viewpoint at the island's eastern tip.", es:"Mirador espectacular en la punta este de la isla.", cr:"Bel pwen vi an bout lès lil-la." },
  "Chutes du Carbet": { en:"Majestic waterfalls at the heart of the national park.", es:"Cascadas majestuosas en el corazón del parque nacional.", cr:"Chit dlo majestyé an mitan pak nasyonal-la." },
  "La Soufrière": { en:"Active volcano, hike up to the summit.", es:"Volcán activo, senderismo hasta la cima.", cr:"Volkan aktif, rando pou rivé o somè-a." },
  "Plage de Grande Anse (Deshaies)": { en:"One of the island's most beautiful beaches, peaceful atmosphere.", es:"Una de las playas más bonitas de la isla, ambiente tranquilo.", cr:"Youn adan pli bel plaj lil-la, anbyans trankil." },
  "Jardin botanique de Deshaies": { en:"Tropical garden with parrots and koi ponds.", es:"Jardín tropical con loros y estanques de carpas koi.", cr:"Jaden twopikal ak jako ek basen pwason koi." },
  "Cascade aux Écrevisses": { en:"Small, very accessible waterfall in the tropical forest.", es:"Pequeña cascada muy accesible en la selva tropical.", cr:"Ti chit dlo fasil pou rivé adan forè twopikal-la." },
  "Réserve Cousteau (îlet Pigeon)": { en:"Snorkeling and diving in a renowned marine reserve.", es:"Esnórquel y buceo en una reconocida reserva marina.", cr:"Naje ak tiba ek plonjé adan an rézèv maritim renonmé." },
  "Fort Fleur d'Épée": { en:"18th-century fortification with a view over the bay.", es:"Fortificación del siglo XVIII con vistas a la bahía.", cr:"Fò 18tyèm syèk ak vi asou bé-a." },
  "Marché de Pointe-à-Pitre": { en:"Spice and fruit market in the city center.", es:"Mercado de especias y frutas en el centro.", cr:"Mahé zépis ek fwi an sant-vil." },
  "Aquarium de Guadeloupe": { en:"Tropical aquarium with sharks and turtles, in Le Gosier.", es:"Acuario tropical con tiburones y tortugas, en Le Gosier.", cr:"Akwaryòm twopikal ak reken ek tòti, Gozyé." },
  "Mémorial ACTe": { en:"Caribbean center for expression and memory of the slave trade and slavery, in Pointe-à-Pitre.", es:"Centro caribeño de expresión y memoria de la trata y la esclavitud, en Pointe-à-Pitre.", cr:"Sant karayib pou memwa lèsklavaj, Pwent-a-Pit." },
  "Terre-de-Haut": { en:"Picturesque islet with coves and colorful houses.", es:"Isla pintoresca con calas y casas de colores.", cr:"Ti lil bel ak ans ek kaz kolowé." },
  "Distilleries de Marie-Galante": { en:"Island with many agricultural rum distilleries.", es:"Isla con numerosas destilerías de ron agrícola.", cr:"Lil ki ni anpil distilri wonm agrikol." },
  "Plages de La Désirade": { en:"Unspoiled island with arid landscapes and deserted beaches.", es:"Isla preservada con paisajes áridos y playas desiertas.", cr:"Lil prézèvé ak péyizaj sèk ek plaj dézè." },
  "Plage de la Perle": { en:"Golden volcanic sand and coconut trees, one of the island's most beautiful beaches, popular with bodyboarders.", es:"Arena volcánica dorada y cocoteros, una de las playas más bonitas de la isla, popular entre los bodyboarders.", cr:"Sab volkanik dorré ek pyé koko, yonn adan pli bel plaj lil-la, koni pou bodyboard." },
  "Plage du Souffleur (Port-Louis)": { en:"Large family-friendly white sand beach in Port-Louis.", es:"Gran playa familiar de arena blanca en Port-Louis.", cr:"Gran plaj sab blan bon pou fanmi, Pòtwi." },
  "Plage du Bourg (Sainte-Anne)": { en:"Lively central beach in the town of Sainte-Anne, calm waters.", es:"Playa central animada del pueblo de Sainte-Anne, aguas tranquilas.", cr:"Plaj santral anniméyé bouk Sent-Àn, dlo trankil." },
  "Anse Laborde (Anse-Bertrand)": { en:"Wild, unspoiled cove in the north of Grande-Terre.", es:"Cala salvaje y preservada al norte de Grande-Terre.", cr:"Ti kriké sovaj é prézèvé nan nò Grand-Tè." },
  "Anse Canot (Saint-Louis)": { en:"Beach lined with casuarina trees on Marie-Galante's windward coast.", es:"Playa bordeada de casuarinas en la costa de barlovento de Marie-Galante.", cr:"Plaj bòdé ak pyé filao bò kot divan Mari-Galant." },
  "Fort Napoléon": { en:"19th-century fort overlooking Terre-de-Haut, exotic garden with free-roaming iguanas, panoramic view of the Saintes bay.", es:"Fuerte del siglo XIX que domina Terre-de-Haut, jardín exótico con iguanas en libertad, vista panorámica de la bahía de los Saintes.", cr:"Fò diznévyèm syèk ki ka domine Tè-d'An-O, jaden egzotik ak igwàn an libèté, bel vi asou bé Lésent." },
  "Sources chaudes de Bouillante": { en:"Natural hot water baths in the wild, fed by La Soufrière's volcanic activity.", es:"Baños de agua caliente natural en plena naturaleza, alimentados por la actividad volcánica de La Soufrière.", cr:"Bin dlo cho natirèl an lanati, ranpli pa aktivité volkanik Soufryè-a." },

function placeDesc(p) {
  if (lang && lang !== 'fr' && DESC_I18N[p.nom] && DESC_I18N[p.nom][lang]) return DESC_I18N[p.nom][lang];
  return p.desc;
}

// Lien Google Maps pour lancer un itinéraire vers un lieu (aucune clé API
// nécessaire — c'est un simple lien universel reconnu par l'appli Maps).
function mapsLink(p) {
  return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
}

// ---- Vocabulaire des types de lieux (typeKey), dérivé des clés type_* déjà
// présentes dans TRANSLATIONS.fr : évite de dupliquer la liste à la main pour
// le <select> du formulaire "Proposer un lieu".
const TYPE_KEYS = Object.keys(TRANSLATIONS.fr).filter(k => k.startsWith('type_')).map(k => k.slice(5));

// ---- Lieux communautaires approuvés (mode collaboratif "Proposer un lieu") ----
// PLACES reste le jeu de données statique (curé) chargé avec la page. Une fois
// des propositions approuvées récupérées depuis Firestore (voir
// loadApprovedCommunityPlaces() plus bas), elles sont converties au même
// format et concaténées dans ALL_PLACES — c'est CE tableau, pas PLACES, que
// toute la recherche/le rendu/le détail parcourent désormais, afin qu'un lieu
// communautaire approuvé se comporte exactement comme un lieu curé sans
// nécessiter de redéploiement.
let communityPlaces = [];
let ALL_PLACES = PLACES.slice();
function rebuildAllPlaces() { ALL_PLACES = PLACES.concat(communityPlaces); }

const FAV_KEY = "antan_nou_favoris_v1";
function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e){ return []; } }
function saveFavs(f) { localStorage.setItem(FAV_KEY, JSON.stringify(f)); }
let favoris = loadFavs();
function isFav(nom) { return favoris.includes(nom); }
function toggleFav(nom) {
  if (isFav(nom)) favoris = favoris.filter(n => n !== nom);
  else favoris.push(nom);
  saveFavs(favoris);
  syncFavorisToCloud();
  renderResults();
  updateFavBadge();
}
function updateFavBadge() {
  const b = document.getElementById('favBadge');
  if (favoris.length > 0) { b.style.display = 'flex'; b.textContent = favoris.length; }
  else { b.style.display = 'none'; }
}

// ---- Mode Chasseur de Trésors (gamification 100% locale, indépendante de Firebase/du compte) ----
const GAME_ENABLED_KEY = "antan_nou_game_enabled";
function loadGameEnabled() { try { return localStorage.getItem(GAME_ENABLED_KEY) === "1"; } catch(e){ return false; } }
function saveGameEnabled(v) { try { localStorage.setItem(GAME_ENABLED_KEY, v ? "1" : "0"); } catch(e){} }
let gameEnabled = loadGameEnabled();
// Pose/retire l'attribut qui scope toute l'identité visuelle sombre/dorée du
// Mode Chasseur (voir le bloc CSS "Mode Chasseur de Trésors") — fait ici dès
// le chargement pour refléter l'état déjà sauvegardé, et à chaque bascule du
// toggle ensuite (voir bindGameToggleSection).
function applyGameModeAttribute() {
  document.documentElement.dataset.gameMode = gameEnabled ? '1' : '0';
}
applyGameModeAttribute();

// Chaque lieu débloqué est stocké comme { nom, bonus } — `bonus` indique s'il
// a été débloqué pendant la fenêtre active d'un événement culturel (voir
// isEventActive), ce qui fait que le bonus de points reste acquis même après
// la fin de l'événement. Compatibilité ascendante : la version précédente du
// module stockait de simples chaînes (nom du lieu) — on les normalise à la
// lecture pour ne pas faire perdre leur progression aux joueurs déjà actifs.
const GAME_UNLOCKED_KEY = "antan_nou_game_unlocked_v1";
function loadGameUnlocked() {
  try {
    const raw = JSON.parse(localStorage.getItem(GAME_UNLOCKED_KEY)) || [];
    return raw.map(entry => (typeof entry === 'string') ? { nom: entry, bonus: false } : entry);
  } catch(e) { return []; }
}
function saveGameUnlocked(u) { try { localStorage.setItem(GAME_UNLOCKED_KEY, JSON.stringify(u)); } catch(e){} }
let gameUnlocked = loadGameUnlocked();
function isGameUnlocked(nom) { return gameUnlocked.some(e => e.nom === nom); }
function getGameUnlockedEntry(nom) { return gameUnlocked.find(e => e.nom === nom); }

async function syncFavorisToCloud() {
  if (!FIREBASE_ENABLED || !currentUser) return;
  try { await db.collection('utilisateurs').doc(currentUser.uid).set({ favoris }, { merge:true }); }
  catch (e) { console.warn('Synchronisation des favoris échouée :', e); }
}

async function mergeFavorisFromCloud() {
  if (!FIREBASE_ENABLED || !currentUser) return;
  try {
    const doc = await db.collection('utilisateurs').doc(currentUser.uid).get();
    const cloudFavs = (doc.exists && Array.isArray(doc.data().favoris)) ? doc.data().favoris : [];
    favoris = Array.from(new Set([...favoris, ...cloudFavs]));
    saveFavs(favoris);
    await syncFavorisToCloud();
    updateFavBadge();
    if (step === 3) renderResults();
  } catch (e) { console.warn('Fusion des favoris échouée :', e); }
}

if (FIREBASE_ENABLED && auth) {
  auth.onAuthStateChanged(user => {
    currentUser = user;
    updateAccountIcon();
    if (user) mergeFavorisFromCloud();
  });
}

function traduireErreurFirebase(e) {
  const c = e && e.code;
  if (c === 'auth/email-already-in-use') return t('errEmailInUse');
  if (c === 'auth/invalid-email') return t('errInvalidEmail');
  if (c === 'auth/weak-password') return t('errWeakPassword');
  if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential') return t('errWrongCreds');
  return t('errGeneric');
}

    document.getElementById('closeAccount').onclick = () => overlay.remove();
    document.getElementById('logoutBtn').onclick = () => { auth.signOut(); overlay.remove(); };

        <p class="step-sub" style="margin:0;">${t('pointsExplainer')}</p>`;
    });

  }

  let mode = 'login';

    overlay.innerHTML = `<div class="modal">

        <p id="accError" style="color:var(--coral); font-size:12.5px; display:none; margin:0 0 12px;"></p>
      </div>
      <button class="btn btn-primary" id="accSubmit" style="width:100%; margin-bottom:10px;">${mode === 'login' ? t('accountLoginBtn') : t('accountCreateBtn')}</button>

// Algorithme de composition : répartit les lieux filtrés sur des créneaux
// Matin / Après-midi / Soir par jour, selon la durée de chaque lieu.
function generateProgram() {
  let pool = ALL_PLACES.filter(p => {
    if (p.t !== progT) return false;
    if (progV.length && !p.v.some(v => progV.includes(v))) return false;
    if (progBudget.length && !progBudget.includes(p.budget)) return false;
    return true;
  });
  // mélange légèrement pour varier les propositions d'une génération à l'autre
  pool = pool.map(p => ({p, r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.p);

  const days = [];
  for (let d = 0; d < progDays; d++) days.push({ matin:null, apresmidi:null, soir:null });

  const used = new Set();
  for (const day of days) {
    for (const slot of ['matin','apresmidi','soir']) {
      if (day[slot]) continue;
      const candidate = pool.find(p => !used.has(p.nom) && (
        (slot === 'soir' && (p.moment === 'soir' || p.duree === 'rapide')) ||
        (slot !== 'soir' && p.moment !== 'soir')
      ) && p.duree !== 'journee');
      if (candidate) {
        day[slot] = candidate;
        used.add(candidate.nom);
        if (candidate.duree === 'demi-journee') {
          // occupe le créneau suivant du même jour si dispo
          const order = ['matin','apresmidi','soir'];
          const idx = order.indexOf(slot);
          const next = order[idx+1];
          if (next && !day[next]) day[next] = { ...candidate, linked:true };
        }
      }
    }
    // une sortie "journée entière" prend toute la journée si rien n'est encore casé
    if (!day.matin && !day.apresmidi && !day.soir) {
      const full = pool.find(p => !used.has(p.nom) && p.duree === 'journee');
      if (full) { day.matin = full; day.apresmidi = { ...full, linked:true }; used.add(full.nom); }
    }
  }
  return days;
}

function renderProgramResult(overlay) {
  const days = generateProgram();
  const labels = { matin:t('slotMatin'), apresmidi:t('slotApresmidi'), soir:t('slotSoir') };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${t('progResultTitle')}</h3><button class="modal-close" id="closeProg2">✕</button></div>

}

// ---- Alertes du moment (calculées localement, sans serveur ni notification push) ----
function getMoonPhase(date) {
  // Renvoie un nombre entre 0 et 1 : 0 = nouvelle lune, 0.5 = pleine lune.
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const synodicMonth = 29.53058867;
  const diffDays = (date.getTime() - knownNewMoon) / 86400000;
  return (((diffDays % synodicMonth) + synodicMonth) % synodicMonth) / synodicMonth;
}
let todayAlerts = [];
// isEventActive() centralise la logique de fenêtre de date des événements
// culturels du champ `evenement` (utilisée par les alertes du jour ET par le
// bonus de points du Mode Chasseur de Trésors) — une seule version de cette
// logique pour éviter que deux copies ne divergent avec le temps.
function isEventActive(ev, date) {
  if (!ev) return false;
  const d = date || new Date();
  const day = d.getDay(), month = d.getMonth() + 1, dateNum = d.getDate();
  if (ev.jours && ev.jours.includes(day)) return true;
  if (ev.debutMois && (
    (month === ev.debutMois && dateNum >= ev.debutJour && ev.debutMois === ev.finMois && dateNum <= ev.finJour) ||
    (month === ev.debutMois && dateNum >= ev.debutJour && ev.debutMois !== ev.finMois) ||
    (month === ev.finMois && dateNum <= ev.finJour && ev.debutMois !== ev.finMois) ||
    (month > ev.debutMois && month < ev.finMois)
  )) return true;
  return false;
}
function computeTodayAlerts() {
  const alerts = [];
  const now = new Date();
  if (Math.abs(getMoonPhase(now) - 0.5) < 0.035) {
    alerts.push({ icon:"🌕", text: t('alertFullMoon'), place: null });
  }
  ALL_PLACES.forEach(p => {
    const ev = p.evenement;
    if (!ev) return;
    if (isEventActive(ev, now)) alerts.push({ icon:"📅", text: `${t(ev.labelKey)} — ${p.nom}`, place: p });
  });
  todayAlerts = alerts;
  return alerts;
}
function renderTodayAlerts() {
  const alerts = computeTodayAlerts();
  if (!alerts.length) return '';
  return `<div class="today-alerts">
    <p class="alerts-title">${t('alertsTitle')}</p>
    ${alerts.map((a,i) => `<div class="alert-chip${a.place ? ' clickable' : ''}" data-alert="${i}">${a.icon} <span>${a.text}</span></div>`).join('')}
  </div>`;
}
function wireTodayAlerts(container) {
  container.querySelectorAll('.alert-chip.clickable[data-alert]').forEach(el => {
    el.onclick = () => {
      const a = todayAlerts[+el.dataset.alert];
      if (a && a.place) openPlaceDetail(a.place);
    };
  });
}

const GAME_LEVEL_FLOORS = [0, 20, 60, 150];
function updateGameHud() {
  const el = document.getElementById('gameHud');
  if (!el) return;
  if (!gameEnabled) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const pts = gameTotalPoints();
  const level = gameLevelForPoints(pts);
  const next = gameNextThreshold(pts);
  const floor = next === null ? GAME_LEVEL_FLOORS[GAME_LEVEL_FLOORS.length - 1] : GAME_LEVEL_FLOORS.filter(f => f <= pts).pop();
  const pct = next === null ? 100 : Math.max(0, Math.min(100, Math.round((pts - floor) / (next - floor) * 100)));
  const count = gameUnlocked.length;
  el.style.display = 'flex';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${level.label} — ${pts} ${t('gamePointsLabel')}, ${count} ${t('gameHudTreasures')}`);
  el.innerHTML = `<span class="gh-level">${level.label}</span>
    <span class="gh-bar" aria-hidden="true"><span class="gh-fill" style="width:${pct}%;"></span></span>
    <span class="gh-meta">⭐ ${pts}${next !== null ? '/' + next : ''} · 🎒 ${count}</span>`;
  el.onclick = () => { if (typeof openGrimoireModal === 'function') openGrimoireModal(); };
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } };
}

// Charge les photos (Wikimedia) des cartes résultat de façon paresseuse : une
// carte n'est récupérée qu'au moment où elle entre (ou approche) le viewport,
// via un seul IntersectionObserver par conteneur, recréé proprement à chaque
// appel de wirePlaceCards (filtres, favoris...) pour ne pas cumuler d'anciens
// observers ni redéclencher un fetch pour une carte déjà traitée.
function wirePlaceCardPhotos(container) {
  wireLazyPhotos(container, '.place.pcard[data-open]', '.pcard-bg');
}
// Même chargement paresseux pour les mini-cartes de l'accueil (collections).
function wireMiniCardPhotos(container) {
  wireLazyPhotos(container, '.mini-card[data-open]', '.visual');
}
function wireLazyPhotos(container, cardSelector, bgSelector) {
  const cards = container.querySelectorAll(cardSelector);
  const loadCardPhoto = (el) => {
    const nom = el.dataset.open;
    const p = ALL_PLACES.find(x => x.nom === nom);
    if (!p) return;
    fetchCardPhoto(p).then(photo => {
      if (!photo) return;
      const bg = el.querySelector(bgSelector);
      if (!bg) return;
      bg.style.backgroundImage = `url('${photo.url.replace(/'/g,"%27")}')`;
      bg.style.backgroundSize = 'cover';
      bg.style.backgroundPosition = 'center';
      bg.textContent = '';
    }).catch(() => {});
  };
  if (container._placePhotoObserver) { container._placePhotoObserver.disconnect(); container._placePhotoObserver = null; }
  if (typeof IntersectionObserver === 'function') {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { obs.unobserve(entry.target); loadCardPhoto(entry.target); }
      });
    }, { rootMargin: '200px' });
    cards.forEach(el => obs.observe(el));
    container._placePhotoObserver = obs;
  } else {
    cards.forEach(loadCardPhoto);
  }
}

// ==================== Accueil : distance à vol d'oiseau (Haversine) ====================
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function requestGeo() {
  if (!navigator.geolocation) { geoState = 'unsupported'; render(); return; }
  geoState = 'loading'; render();
  navigator.geolocation.getCurrentPosition(
    pos => { geoCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; geoState = 'ok'; render(); },
    () => { geoState = 'denied'; render(); },
    { timeout: 8000 }
  );
}
// Retourne les lieux triés par distance depuis geoCoords, filtrés selon
// geoRadius. "Dans ma commune" utilise la même zone (`z`) que le lieu le plus
// proche comme approximation (la base ne connaît pas les limites communales
// précises) ; "Partout en [territoire]" utilise le territoire du lieu le
// plus proche.
function computeNearby() {
  if (!geoCoords) return { list: [], nearest: null };
  const withDist = ALL_PLACES.map(p => ({ p, d: haversineKm(geoCoords.lat, geoCoords.lng, p.lat, p.lng) })).sort((a,b) => a.d - b.d);
  const nearest = withDist[0] ? withDist[0].p : null;
  let filtered;
  if (geoRadius === '5') filtered = withDist.filter(x => x.d <= 5);
  else if (geoRadius === '10') filtered = withDist.filter(x => x.d <= 10);
  else if (geoRadius === 'commune' && nearest) filtered = withDist.filter(x => x.p.z === nearest.z);
  else if (geoRadius === 'all' && nearest) filtered = withDist.filter(x => x.p.t === nearest.t);
  else filtered = withDist;
  return { list: filtered.map(x => x.p), nearest };
}
function renderGeoSection() {
  let body;
  if (geoState === 'idle') {
    body = `<button class="geo-btn" id="geoUseBtn">📍 ${t('geoUseBtn')}</button>`;
  } else if (geoState === 'loading') {
    body = `<p class="geo-note">${t('geoLoading')}</p>`;
  } else if (geoState === 'unsupported') {
    body = `<p class="geo-note">${t('geoUnsupported')}</p>`;
  } else if (geoState === 'denied') {
    body = `<p class="geo-note">${t('geoDenied')}</p>`;
  } else if (geoState === 'ok') {
    const { list, nearest } = computeNearby();
    const terrLabel = nearest ? (TERRITOIRES.find(x => x.key === nearest.t) || {}).label : '';
    body = `
      <div class="geo-chip-row">
        <span class="geo-chip ${geoRadius==='5'?'sel':''}" data-r="5">${t('geo5')}</span>
        <span class="geo-chip ${geoRadius==='10'?'sel':''}" data-r="10">${t('geo10')}</span>
        <span class="geo-chip ${geoRadius==='commune'?'sel':''}" data-r="commune">${t('geoCommune')}</span>
        <span class="geo-chip ${geoRadius==='all'?'sel':''}" data-r="all">${t('geoAllPrefix')} ${terrLabel}</span>
      </div>
      <p class="geo-count">${list.length} ${list.length > 1 ? t('geoCountPlural') : t('geoCountSingular')}</p>
      ${list.length === 0
        ? `<p class="geo-note">${t('geoEmpty')}</p>`
        : `<div class="h-scroll">${list.slice(0,20).map(p => miniCardHTML(p)).join('')}</div>`}
    `;
  }
  return `<div class="home-section">
    <p class="home-section-title">${t('geoTitle')}</p>
    <div id="geoBody">${body}</div>
  </div>`;
}
function wireGeoSection(container) {
  const btn = container.querySelector('#geoUseBtn');
  if (btn) btn.onclick = requestGeo;
  container.querySelectorAll('.geo-chip[data-r]').forEach(el => {
    el.onclick = () => { geoRadius = el.dataset.r; render(); };
  });
  wireMiniCards(container);
}

// ==================== Accueil : Nos sélections (collections) ====================
// Construites uniquement à partir des lieux et tags déjà présents dans
// PLACES — aucune donnée inventée (pas d'agenda d'événements réel, aucune
// note ou nombre de favoris fictif).
function buildCollections() {
  const byPlage = p => p.v.includes('plage');
  const colls = [
    { key:'soleil', titleKey:'collSoleil', places: ALL_PLACES.filter(byPlage).slice(0, 10) },
    { key:'plages', titleKey:'collPlages', places: ALL_PLACES.filter(p => p.typeKey === 'plage') },
    { key:'balades', titleKey:'collBalades', places: ALL_PLACES.filter(p => p.v.includes('randonnee') && (!p.difficulte || p.difficulte <= 3)) },
    { key:'romantique', titleKey:'collRomantique', places: ALL_PLACES.filter(p => p.v.some(v => ['bienetre','boire','photo'].includes(v)) && !p.v.includes('famille')) },
    { key:'famille', titleKey:'collFamille', places: ALL_PLACES.filter(p => p.v.includes('famille') || p.acces.includes('poussette')) },
    { key:'gratuit', titleKey:'collGratuit', places: ALL_PLACES.filter(p => p.budget === 'gratuit') },
    { key:'coucherSoleil', titleKey:'collCoucherSoleil', places: ALL_PLACES.filter(p => p.v.includes('photo') && (p.v.includes('plage') || p.typeKey === 'point_de_vue' || p.typeKey === 'ilet_rocher')) },
  ];
  return colls.filter(c => c.places.length >= 2);
}
function openCollection(coll) {
  collectionOverride = coll;

function renderCollectionsSection() {

function wireCollectionsSection(container) {

// ==================== Accueil : recherche globale (toutes les îles) ====================
function computeHomeSearch(q) {
  const query = q.trim().toLowerCase();
  if (!query) return [];
  return ALL_PLACES.filter(p => {
    const haystack = (p.nom + ' ' + p.z + ' ' + placeDesc(p) + ' ' + p.v.map(v => t('vibe_'+v)).join(' ')).toLowerCase();
    return haystack.includes(query);
  }).slice(0, 40);
}
function renderHomeDynamicArea() {
  const area = document.getElementById('homeDynamicArea');
  if (!area) return;
  if (homeSearchQ.trim()) {

    area.innerHTML = results.length === 0
      ? `<div class="empty"><span class="e">🌴</span>${t('emptyResults')}</div>`
      : `<div class="home-section"><div class="postcard-grid">${results.map(p => placeCardHTML(p)).join('')}</div></div>`;

const SURPRISE_WHO_VIBES = {
  famille: ['famille'],
  couple: ['bienetre','boire','photo'],
  amis: ['activites','sport','nightlife'],
  solo: ['activites','sport','nightlife'],
};
function surpriseMatches() {
  const f = surpriseFilters;
  return ALL_PLACES.filter(p =>
    (!f.t || p.t === f.t) &&
    (!f.budget || p.budget === f.budget) &&
    (!f.duree || p.duree === f.duree) &&
    (!f.who || p.v.some(v => SURPRISE_WHO_VIBES[f.who].includes(v)))
  );
}
function pickSurprise() {
  const matches = surpriseMatches();
  if (!matches.length) { surprisePick = null; return; }
  let pool = matches;
  if (matches.length > 1 && surpriseLastNom) pool = matches.filter(p => p.nom !== surpriseLastNom);
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  surprisePick = chosen;
  surpriseLastNom = chosen.nom;
}

    document.getElementById('restart').onclick = () => { collectionOverride=null; selT=null; selZ=null; selV=[]; selBudget=[]; selDuree=[]; selMoment=[]; selAcces=[]; searchQ=''; sortBy='pertinence'; viewMode='liste'; setStep(0); };
    renderResults();
    appendLegalFooter();
    renderBottomNav(viewMode === 'carte' ? 'carte' : 'explorer');
    return;
  }
}

function renderResults() {
  // Une "Collection" (Nos sélections, accueil) affiche sa propre liste de
  // lieux sans repasser par les filtres territoire/zone/envies — seule la
  // recherche libre s'applique encore par-dessus.
  let results = collectionOverride ? collectionOverride.places.slice() : ALL_PLACES.filter(p => {
    if (p.t !== selT) return false;
    if (selZ && p.z !== selZ) return false;
    if (selV.length && !p.v.some(v => selV.includes(v))) return false;
    if (selBudget.length && !selBudget.includes(p.budget)) return false;
    if (selDuree.length && !selDuree.includes(p.duree)) return false;
    if (selMoment.length && !selMoment.includes(p.moment)) return false;
    if (selAcces.length && !selAcces.every(a => p.acces.includes(a))) return false;
    return true;
  });
  if (searchQ.trim()) {
    const q = searchQ.trim().toLowerCase();
    results = results.filter(p => {
      const haystack = (p.nom + ' ' + p.z + ' ' + placeDesc(p) + ' ' + p.v.map(v => t('vibe_'+v)).join(' ')).toLowerCase();
      return haystack.includes(q);
    });
  }
  if (sortBy === 'alpha') results = results.slice().sort((a,b) => a.nom.localeCompare(b.nom));
  if (sortBy === 'favoris') results = results.filter(p => isFav(p.nom));

  document.getElementById('resCount').textContent = results.length + ' ' + (results.length>1?t('resultPlural'):t('resultSingular'));

  const listEl = document.getElementById('resultsList');
  const mapEl = document.getElementById('mapView');
  if (viewMode === 'carte') {
    listEl.style.display = 'none';
    mapEl.style.display = 'block';
    renderMapView(results);
    return;
  }
  listEl.style.display = '';
  mapEl.style.display = 'none';
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }

  listEl.innerHTML = results.length === 0
    ? `<div class="empty"><span class="e">🌴</span>${sortBy==='favoris' ? t('emptyFavoris') : t('emptyResults')}</div>`
    : results.map(p => placeCardHTML(p)).join('');
  wirePlaceCards(listEl);
}

      iconSize: [28, 28], iconAnchor: [14, 28],

// ---- Photos libres de droit (Wikimedia Commons + Openverse) ----
// Openverse agrège sous licences libres Unsplash, Pexels, Pixabay, Flickr
// Commons et d'autres sources, sans clé API requise — complément naturel à
// Wikimedia pour les lieux peu documentés sur Commons.
const TERRITOIRE_SEARCH_TERM = {
  martinique: "Martinique", guadeloupe: "Guadeloupe", guyane: "French Guiana",
  "saint-martin": "Saint Martin Caribbean", "saint-barthelemy": "Saint Barthélemy",
};
const photoCache = {};
// Photos propres à l'app : champ optionnel `photos` sur un lieu, par exemple
//   photos:["assets/lieux/anse-dufour.jpg"]
//   photos:[{ src:"assets/lieux/anse-dufour.jpg", credit:"Photo : Maureen" }]
// Elles passent toujours avant Wikimedia / Openverse.
function ownPhotos(p) {
  if (!p || !Array.isArray(p.photos)) return [];
  return p.photos
    .map(ph => typeof ph === 'string' ? { src: ph } : ph)
    .filter(ph => ph && ph.src)
    .map(ph => ({ url: ph.src, page: null, source: ph.credit || 'Antan Nou' }));
}
// Les requêtes photo ne doivent jamais bloquer l'affichage : chaque source a
// son propre délai maximum, et on limite le nombre de requêtes simultanées
// (l'accueil peut afficher des dizaines de cartes d'un coup).
function fetchWithTimeout(url, ms) {
  if (typeof AbortController !== 'function') return fetch(url);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}
const PHOTO_MAX_CONCURRENT = 4;
let photoActive = 0;
const photoWaiting = [];
function photoLimited(task) {
  return new Promise((resolve, reject) => {
    const run = () => {
      photoActive++;
      task().then(resolve, reject).finally(() => {
        photoActive--;
        const next = photoWaiting.shift();
        if (next) next();
      });
    };
    if (photoActive < PHOTO_MAX_CONCURRENT) run(); else photoWaiting.push(run);
  });
}
async function fetchWikimediaPhotos(p) {
  try {
    const term = `${p.nom} ${TERRITOIRE_SEARCH_TERM[p.t] || ''}`;
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
    const res = await fetchWithTimeout(url, 6000);
    const json = await res.json();
    const pages = json.query && json.query.pages;
    if (!pages) return [];
    return Object.values(pages)
      .map(pg => pg.imageinfo && pg.imageinfo[0])
      .filter(Boolean)
      .filter(info => info.url && !/\.(svg|pdf|ogv|webm|tif|tiff|djvu|xcf)$/i.test(info.url))
      .map(info => ({ url: info.thumburl || info.url, page: info.descriptionurl || info.url, source: "Wikimedia Commons" }));
  } catch (e) {
    return [];
  }
}
async function fetchOpenversePhotos(p) {
  try {
    const term = `${p.nom} ${TERRITOIRE_SEARCH_TERM[p.t] || ''}`;
    const url = `https://api.openverse.org/v1/images/?q=${encodeURIComponent(term)}&license_type=all-cc,publicdomain&page_size=6`;
    const res = await fetchWithTimeout(url, 6000);
    const json = await res.json();
    const results = Array.isArray(json.results) ? json.results : [];
    return results
      // Wikimedia est déjà couvert par fetchWikimediaPhotos ci-dessus : on
      // évite les doublons en ne gardant que les autres sources agrégées
      // (Flickr, Pixabay, etc. — Unsplash/Pexels n'y figurent qu'indirectement).
      .filter(r => r && r.url && r.source !== 'wikimedia')
      .map(r => ({
        url: r.thumbnail || r.url,
        page: r.foreign_landing_url || r.url,
        source: `Openverse${r.source ? ' · ' + r.source : ''}`,
      }));
  } catch (e) {
    return [];
  }
}
async function fetchPlacePhotos(p) {
  if (photoCache[p.nom] !== undefined) return photoCache[p.nom];
  const own = ownPhotos(p);
  const [wiki, openverse] = await photoLimited(() => Promise.all([
    fetchWikimediaPhotos(p),
    fetchOpenversePhotos(p),
  ]));
  const results = [...own, ...wiki, ...openverse].slice(0, 10);
  // On ne met en cache un résultat vide que si les deux sources ont répondu
  // : un échec réseau ponctuel ne doit pas masquer les photos pour la session.
  if (results.length) photoCache[p.nom] = results;
  return results;
}

// Photo de carte (accueil, résultats) : on n'attend que la source rapide
// (Wikimedia) ; Openverse n'est interrogé que si Wikimedia ne renvoie rien.
const cardPhotoCache = {};
async function fetchCardPhoto(p) {
  const own = ownPhotos(p);
  if (own.length) return own[0];
  if (photoCache[p.nom] && photoCache[p.nom].length) return photoCache[p.nom][0];
  if (cardPhotoCache[p.nom] !== undefined) return cardPhotoCache[p.nom];
  let photos = await photoLimited(() => fetchWikimediaPhotos(p));
  if (!photos.length) photos = await photoLimited(() => fetchOpenversePhotos(p));
  const first = photos[0] || null;
  if (first) cardPhotoCache[p.nom] = first;
  return first;
}

// ---- Rareté & niveaux du Mode Chasseur de Trésors (système séparé des points de contribution ci-dessus) ----
const GAME_RARITY_OR = ["volcan","site_archeologique","grotte_faille","source_chaude","pont_suspendu","ilet_rocher","cimetiere","installation_culturelle","site_technique"];
const GAME_RARITY_ARGENT = ["phare","fort","habitation","distillerie","musee","reserve_naturelle","cascade","mangrove","eglise_cathedrale","jardin","zoo_aquarium","parc_aventure","spot_photo","point_de_vue","sentier"];
const GAME_RARITY_POINTS = { or: 20, argent: 10, bronze: 5 };
function rarityForPlace(p) {
  const key = p && p.typeKey;
  if (GAME_RARITY_OR.includes(key)) return 'or';
  if (GAME_RARITY_ARGENT.includes(key)) return 'argent';
  return 'bronze';
}
function gameRarityIcon(rarity) { return rarity === 'or' ? '🥇' : rarity === 'argent' ? '🥈' : '🥉'; }
// Points d'un lieu débloqué pendant la fenêtre active d'un événement culturel
// réel (voir isEventActive) : doublés, et le bonus reste acquis pour ce lieu
// même après la fin de l'événement (voir la forme stockée de gameUnlocked).
const GAME_EVENT_BONUS_MULTIPLIER = 2;
// Bonus optionnel, purement décoratif, pour un badge de territoire/zone
// complété à 100 % — recalculé à chaque appel à partir de gameZoneBadges(),
// jamais stocké, pour ne jamais pouvoir se désynchroniser des lieux réellement
// débloqués.
const GAME_BADGE_BONUS_POINTS = 10;
function gameTotalPoints() {
  const unlockPoints = gameUnlocked.reduce((sum, entry) => {
    // ALL_PLACES (pas PLACES) : un lieu communautaire débloqué doit compter
    // dans les points totaux au même titre qu'un lieu curé.
    const p = ALL_PLACES.find(x => x.nom === entry.nom);
    if (!p) return sum;
    return sum + GAME_RARITY_POINTS[rarityForPlace(p)] * (entry.bonus ? GAME_EVENT_BONUS_MULTIPLIER : 1);
  }, 0);
  const badgePoints = gameCompletedZoneBadgesCount() * GAME_BADGE_BONUS_POINTS;
  return unlockPoints + badgePoints;
}
// ---- Badges de territoire/zone (dérivés en direct de PLACES + gameUnlocked, aucun stockage dédié) ----
function gameZoneBadges() {
  const groups = {};
  PLACES.forEach(p => {
    const key = p.t + '|' + p.z;
    if (!groups[key]) groups[key] = { t: p.t, z: p.z, total: 0, unlocked: 0 };
    groups[key].total++;
    if (isGameUnlocked(p.nom)) groups[key].unlocked++;
  });
  return Object.values(groups);
}
function gameZoneBadgesOrdered() {
  const groups = gameZoneBadges();
  return TERRITOIRES
    .map(terr => groups.filter(g => g.t === terr.key).sort((a, b) => a.z.localeCompare(b.z)))
    .flat();
}
function gameCompletedZoneBadgesCount() {
  return gameZoneBadges().filter(g => g.total > 0 && g.unlocked === g.total).length;
}
function gameLevelForPoints(pts) {
  if (pts >= 150) return { key: 'gameLevelMaitre', label: t('gameLevelMaitre') };
  if (pts >= 60) return { key: 'gameLevelGardien', label: t('gameLevelGardien') };
  if (pts >= 20) return { key: 'gameLevelMarcheur', label: t('gameLevelMarcheur') };
  return { key: 'gameLevelTiMoun', label: t('gameLevelTiMoun') };
}
function gameNextThreshold(pts) {
  if (pts < 20) return 20;
  if (pts < 60) return 60;
  if (pts < 150) return 150;
  return null;
}

// Types de lieux extérieurs/de randonnée : tolérance GPS élargie (le signal est

const GAME_OUTDOOR_TYPES = ["sentier","cascade","reserve_naturelle","volcan","mangrove","riviere_bassin","point_de_vue","pont_suspendu","grotte_faille","source_chaude","phare","ilet_rocher"];
function gameToleranceMeters(p) {

}

// ---- Déblocage d'un lieu (géolocalisation + distance en direct) ----
// Tant que le lieu n'est pas débloqué, la fiche affiche un panneau "distance

function gameSectionHTML(p) {

  const icon = gameRarityIcon(rarity);

  return `<div class="day-card ${unlocked ? '' : 'game-card'}" id="gameSection" style="margin-top:4px;">

    ${unlocked ? `

}
function refreshGameSection(p) {
  const el = document.getElementById('gameSection');
  if (!el) return;
  el.outerHTML = gameSectionHTML(p);
  bindGameSection(p);
}
function bindGameSection(p) {

  if (btn) btn.onclick = () => gameAttemptUnlock(p);
  // Lance le suivi en direct uniquement si le lieu reste à débloquer — une
  // fois débloqué, gameSectionHTML ne régénère plus ce panneau et il n'y a

  if (!isGameUnlocked(p.nom)) startGameDetailDistanceWatch(p);
  else stopGameDetailDistanceWatch();
}
// Marque un lieu comme débloqué (partagé entre le suivi automatique et le
// bouton manuel) et renvoie les points gagnés, pour l'animation de découverte.
function gameMarkUnlocked(p) {
  const alreadyUnlocked = isGameUnlocked(p.nom);
  const bonus = !!(p.evenement && isEventActive(p.evenement, new Date()));
  if (!alreadyUnlocked) {
    gameUnlocked.push({ nom: p.nom, bonus });
    saveGameUnlocked(gameUnlocked);
    updateGameHud();
  }
  return { alreadyUnlocked, points: GAME_RARITY_POINTS[rarityForPlace(p)] * (bonus ? GAME_EVENT_BONUS_MULTIPLIER : 1) };
}
function gameFormatDistanceLabel(distM, tol) {
  const near = distM <= tol + GAME_NEARBY_EXTRA_METERS;
  return { label: t(near ? 'gameTreasureNearby' : 'gameMysteryDetected'), value: `${Math.round(distM)}<span class="unit"> m</span>` };
}
function gameUpdateDistancePanel(p, pos) {
  const labelEl = document.getElementById('gameDistanceLabel');
  const valueEl = document.getElementById('gameDistanceValue');
  if (!labelEl || !valueEl) return; // fiche fermée / section déjà changée
  const distM = haversineKm(pos.coords.latitude, pos.coords.longitude, p.lat, p.lng) * 1000;
  const tol = gameToleranceMeters(p);
  if (distM <= tol) {
    stopGameDetailDistanceWatch();
    const { alreadyUnlocked, points } = gameMarkUnlocked(p);
    refreshGameSection(p);
    refreshGameToggleSectionIfOpen();
    if (!alreadyUnlocked) gameShowDiscoveryAnimation(p, points);
    return;
  }
  const { label, value } = gameFormatDistanceLabel(distM, tol);
  labelEl.textContent = label;
  valueEl.innerHTML = value;
}
let gameDetailWatchId = null;
let gameDetailWatchPlace = null;
function startGameDetailDistanceWatch(p) {
  if (!navigator.geolocation) return;

  if (gameDetailWatchId !== null && gameDetailWatchPlace === p.nom) return;
  stopGameDetailDistanceWatch();
  gameDetailWatchPlace = p.nom;
  gameDetailWatchId = navigator.geolocation.watchPosition(
    pos => gameUpdateDistancePanel(p, pos),
    () => {}, // échec/refus silencieux ici : le bouton manuel donne le message d'erreur explicite au clic
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }

}

function gameAttemptUnlock(p) {

  }
  if (statusEl) statusEl.innerHTML = `<p class="step-sub" style="margin:0;">${t('gameCheckingLocation')}</p>`;
  navigator.geolocation.getCurrentPosition(
    pos => {
      const distM = haversineKm(pos.coords.latitude, pos.coords.longitude, p.lat, p.lng) * 1000;
      const tol = gameToleranceMeters(p);
      if (distM <= tol) {
        stopGameDetailDistanceWatch();
        const { alreadyUnlocked, points } = gameMarkUnlocked(p);
        refreshGameSection(p);
        refreshGameToggleSectionIfOpen();
        if (!alreadyUnlocked) gameShowDiscoveryAnimation(p, points);
      } else if (statusEl) {
        statusEl.innerHTML = `<p class="step-sub" style="color:var(--coral); margin:0;">${t('gameTooFar')} (${Math.round(distM)} m)</p>`;

    () => {

// ---- "Tu es passé à côté" (section 21 du cahier des charges) ----
// Pendant que le Mode Chasseur est actif, on suit la position en tâche de
// fond (watchPosition, basse précision pour ménager la batterie) et on
// prévient discrètement l'utilisateur quand il passe près d'un trésor non
// débloqué, sans jamais révéler lequel avant qu'il touche la notification —
// l'objectif étant ce sentiment "je suis passé ici des dizaines de fois sans
// le savoir". Zone de notification = juste au-delà du rayon de déblocage de
// chaque lieu (gameToleranceMeters) jusqu'à GAME_NEARBY_EXTRA_METERS plus
// loin ; en dessous de ce rayon, le lieu est de toute façon déblocable
// directement depuis sa fiche. Valeur non codée en dur ailleurs que cette
// constante, modifiable sans toucher à la logique.
const GAME_NEARBY_EXTRA_METERS = 300;
// Pour ne pas re-notifier en boucle quand on habite ou travaille près d'un
// trésor non découvert, chaque lieu signalé entre dans un cooldown persistant
// (localStorage) avant de pouvoir redéclencher une notification.
const GAME_NEARBY_COOLDOWN_MS = 24 * 60 * 60 * 1000; // 24h
const GAME_NEARBY_NOTIFIED_KEY = "antan_nou_game_nearby_notified";
function loadGameNearbyNotified() {
  try { return JSON.parse(localStorage.getItem(GAME_NEARBY_NOTIFIED_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveGameNearbyNotified(map) {
  try { localStorage.setItem(GAME_NEARBY_NOTIFIED_KEY, JSON.stringify(map)); } catch (e) {}
}
let gameNearbyNotified = loadGameNearbyNotified();
let gameNearbyWatchId = null;
let gameNearbyToastShowing = false;

function gameNearbyOnPosition(pos) {
  // Un toast déjà affiché : on ne va pas en empiler un deuxième par-dessus,
  // l'utilisateur verra le prochain lieu la fois suivante.
  if (gameNearbyToastShowing) return;
  const now = Date.now();
  let best = null, bestDist = Infinity;
  for (const p of ALL_PLACES) {
    if (!p.lat || !p.lng || isGameUnlocked(p.nom)) continue;
    const distM = haversineKm(pos.coords.latitude, pos.coords.longitude, p.lat, p.lng) * 1000;
    const tol = gameToleranceMeters(p);
    if (distM <= tol || distM > tol + GAME_NEARBY_EXTRA_METERS) continue; // trop près (déblocable) ou trop loin
    const lastNotified = gameNearbyNotified[p.nom];
    if (lastNotified && (now - lastNotified) < GAME_NEARBY_COOLDOWN_MS) continue;
    if (distM < bestDist) { best = p; bestDist = distM; }
  }
  if (best) {
    gameNearbyNotified[best.nom] = now;
    saveGameNearbyNotified(gameNearbyNotified);
    showGameNearbyToast(best);
  }
}
function startGameNearbyWatch() {
  if (!navigator.geolocation || gameNearbyWatchId !== null) return;
  gameNearbyWatchId = navigator.geolocation.watchPosition(
    gameNearbyOnPosition,
    () => {}, // échec/refus silencieux : ce n'est qu'une notification d'ambiance, pas une action demandée explicitement
    { enableHighAccuracy: false, maximumAge: 60000, timeout: 20000 }
  );
}
function stopGameNearbyWatch() {
  if (gameNearbyWatchId !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(gameNearbyWatchId);
  }
  gameNearbyWatchId = null;
}
function showGameNearbyToast(p) {
  const existing = document.querySelector('.game-nearby-toast');
  if (existing) existing.remove();
  gameNearbyToastShowing = true;
  const toast = document.createElement('div');
  toast.className = 'game-nearby-toast';
  toast.innerHTML = `
    <span class="gnt-icon">🧭</span>
    <div class="gnt-body">
      <p class="gnt-title">${t('gameNearbyTitle')}</p>
      <p class="gnt-sub">${t('gameNearbySub')}</p>
    </div>
    <button class="gnt-close" aria-label="${t('detailClose') || '✕'}">✕</button>`;
  document.body.appendChild(toast);
  const dismiss = () => { toast.remove(); gameNearbyToastShowing = false; };
  toast.querySelector('.gnt-close').onclick = (e) => { e.stopPropagation(); dismiss(); };
  toast.onclick = () => { dismiss(); openPlaceDetail(p); };
  setTimeout(() => { if (document.body.contains(toast)) dismiss(); }, 9000);
}
// Démarre/arrête la surveillance en fonction de l'état du Mode Chasseur, à la
// fois au chargement (si déjà activé depuis une session précédente) et à
// chaque bascule du toggle.
function syncGameNearbyWatch() {
  if (gameEnabled) startGameNearbyWatch(); else stopGameNearbyWatch();
}

// ---- Partage de la carte de niveau (canvas client-side, aucun backend) ----
// Réduit progressivement la taille de police jusqu'à ce que le texte tienne
// dans maxWidth, puis le dessine centré en (x, y).
function gameFitCenteredText(ctx, text, x, y, maxWidth, weight, startSize, family) {
  let size = startSize;
  while (size > 18) {
    ctx.font = `${weight} ${size}px '${family}', 'Montserrat', sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
}
// Génère la carte de partage 1080×1080 en Promise<HTMLCanvasElement|null> —
// ne lève jamais : en cas d'erreur (canvas non supporté, logo introuvable...),
// se rabat sur une carte texte seul, et en dernier recours résout `null`.
function gameShareCardCanvas() {
  return new Promise(resolve => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 1080; canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      if (!ctx) { resolve(null); return; }

      const rootStyle = getComputedStyle(document.documentElement);
      const forestTeal = (rootStyle.getPropertyValue('--forest-teal') || '#093B36').trim() || '#093B36';
      const cream = (rootStyle.getPropertyValue('--cream-bg') || '#F8F6ED').trim() || '#F8F6ED';
      const sunYellow = (rootStyle.getPropertyValue('--sun-yellow') || '#F8A411').trim() || '#F8A411';
      const warmOrange = (rootStyle.getPropertyValue('--warm-orange') || '#F66620').trim() || '#F66620';

      const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
      grad.addColorStop(0, forestTeal);
      grad.addColorStop(1, '#071F1A');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1080);

      const pts = gameTotalPoints();
      const level = gameLevelForPoints(pts);
      const unlockedPlaces = ALL_PLACES.filter(p => isGameUnlocked(p.nom));
      const territoireCounts = {};
      unlockedPlaces.forEach(p => { territoireCounts[p.t] = (territoireCounts[p.t] || 0) + 1; });
      const territoireLines = TERRITOIRES
        .filter(terr => territoireCounts[terr.key])
        .map(terr => `${territoireCounts[terr.key]} ${terr.label}`);

      function drawTextAndResolve() {
        try {
          ctx.textAlign = 'center';
          ctx.fillStyle = cream;
          ctx.font = "800 62px 'Baloo 2', 'Montserrat', sans-serif";
          ctx.fillText('ANTAN NOU', 540, 300);

          ctx.fillStyle = sunYellow;
          ctx.font = "700 26px 'Montserrat', sans-serif";
          ctx.fillText((t('brandTagline') || '').toUpperCase(), 540, 344);

          ctx.fillStyle = warmOrange;
          gameFitCenteredText(ctx, level.label, 540, 540, 920, 800, 48, 'Baloo 2');

          ctx.fillStyle = cream;
          ctx.font = "700 42px 'Montserrat', sans-serif";
          ctx.fillText(`⭐ ${pts} ${t('gamePointsLabel')}`, 540, 630);

          ctx.font = "600 30px 'Montserrat', sans-serif";
          ctx.fillText(`${unlockedPlaces.length} ${t('gameShareLieuxLabel')}`, 540, 678);

          ctx.font = "500 26px 'Montserrat', sans-serif";
          let y = 750;
          territoireLines.forEach(line => { ctx.fillText(line, 540, y); y += 40; });

          resolve(canvas);
        } catch (e) {
          resolve(canvas); // le fond + éventuellement une partie du texte suffisent déjà
        }
      }

      try {
        const logoImg = new Image();
        logoImg.onload = () => {
          try { ctx.drawImage(logoImg, 480, 70, 120, 120); } catch (e) { /* on continue sans logo */ }
          drawTextAndResolve();
        };
        logoImg.onerror = () => drawTextAndResolve();
        logoImg.src = 'assets/logo-antan-nou.svg';
      } catch (e) {
        drawTextAndResolve();
      }
    } catch (e) {
      resolve(null);
    }
  });
}
function gameShareStatusMsg(msg) {
  const el = document.getElementById('gameShareStatus');
  if (el) el.textContent = msg;
}
// Orchestration du partage : Web Share API (fichier image) en priorité,
// sinon téléchargement du PNG, avec repli sur le partage texte si le partage
// de fichier spécifiquement n'est pas supporté mais que l'API existe. Ne
// laisse jamais l'utilisateur sans retour, même si aucune API n'existe.
async function gameShareCard() {
  gameShareStatusMsg(t('gameSharePreparing'));
  const canvas = await gameShareCardCanvas();
  if (!canvas) {
    gameShareStatusMsg(t('gameShareError'));
    return;
  }
  const pts = gameTotalPoints();
  const level = gameLevelForPoints(pts);
  const shareText = `${level.label} — ⭐ ${pts} ${t('gamePointsLabel')} ${t('gameShareViaSuffix')}`;

  canvas.toBlob(async blob => {
    if (!blob) { gameShareStatusMsg(t('gameShareError')); return; }
    const fileName = 'antan-nou-grimoire.png';
    let file = null;
    try { file = new File([blob], fileName, { type: 'image/png' }); } catch (e) { /* File non dispo : on retombera sur le téléchargement */ }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: shareText, title: 'Antan Nou' });
        gameShareStatusMsg(t('gameShareDone'));
        return;
      } catch (e) {
        // Partage annulé par l'utilisateur ou API indisponible au dernier moment :
        // on retombe sur le téléchargement ci-dessous plutôt que de rester bloqué.
      }
    }

    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      if (navigator.share) {
        try { await navigator.share({ text: shareText, title: 'Antan Nou' }); }
        catch (e) { /* partage texte facultatif : le téléchargement a déjà eu lieu */ }
      }
      gameShareStatusMsg(t('gameShareDownloaded'));
    } catch (e) {
      gameShareStatusMsg(t('gameShareError'));
    }
  }, 'image/png');
}

let selectedNote = 0;
let selectedAvisPhotoBlob = null;
// Redimensionne côté client une image sélectionnée avant envoi, pour limiter
// le coût de stockage (projet perso gratuit) : max ~1600px sur le plus grand
// côté, ré-encodée en JPEG qualité ~0.8. En cas d'échec (canvas indisponible,
// format non décodable...), on retombe simplement sur le fichier original :
// ça ne doit jamais bloquer l'envoi de l'avis.
function resizeAvisPhoto(file) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const maxSide = 1600;
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            if (width >= height) { height = Math.round(height * maxSide / width); width = maxSide; }
            else { width = Math.round(width * maxSide / height); height = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => {
            URL.revokeObjectURL(url);
            resolve(blob || file);
          }, 'image/jpeg', 0.8);
        } catch (e) {
          URL.revokeObjectURL(url);
          resolve(file);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (e) {
      resolve(file);
    }
  });
}
async function loadAvis(p) {

      } else {

          ${e.commentaire ? `<p style="margin:0 0 6px; font-size:13px;">${e.commentaire.replace(/</g,'&lt;')}</p>` : ''}
          ${e.photoUrl ? `<a href="${e.photoUrl}" target="_blank" rel="noopener"><img src="${e.photoUrl}" alt="" loading="lazy" style="width:84px; height:84px; object-fit:cover; border-radius:10px; display:block;"></a>` : ''}
        </div>`).join('');
    }
  } catch (e) {
    if (box) box.innerHTML = `<p class="step-sub">${t('avisError')}</p>`;
  }
}

  selectedAvisPhotoBlob = null;
  const stars = formBox.querySelectorAll('#avisStars span');
  stars.forEach(s => {
    s.onclick = () => {
      selectedNote = parseInt(s.dataset.n, 10);
      stars.forEach(x => x.style.opacity = parseInt(x.dataset.n, 10) <= selectedNote ? '1' : '0.3');
    };
  });
  const photoInput = document.getElementById('avisPhotoInput');
  const previewWrap = document.getElementById('avisPhotoPreviewWrap');
  const previewImg = document.getElementById('avisPhotoPreviewImg');
  const removeBtn = document.getElementById('avisPhotoRemoveBtn');
  const statusEl = document.getElementById('avisPhotoStatus');
  const AVIS_PHOTO_MAX_BYTES = 5 * 1024 * 1024;
  const showPhotoStatus = (msg, isError) => {
    if (!statusEl) return;
    if (!msg) { statusEl.style.display = 'none'; statusEl.textContent = ''; return; }
    statusEl.style.display = 'block';
    statusEl.textContent = msg;
    statusEl.style.color = isError ? '#c0392b' : '';
  };
  photoInput.onchange = async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) { selectedAvisPhotoBlob = null; previewWrap.style.display = 'none'; showPhotoStatus(''); return; }
    if (!file.type || !file.type.startsWith('image/')) {
      showPhotoStatus(t('avisPhotoWrongType'), true);
      photoInput.value = '';
      selectedAvisPhotoBlob = null;
      previewWrap.style.display = 'none';
      return;
    }
    if (file.size > AVIS_PHOTO_MAX_BYTES) {
      showPhotoStatus(t('avisPhotoTooLarge'), true);
      photoInput.value = '';
      selectedAvisPhotoBlob = null;
      previewWrap.style.display = 'none';
      return;
    }
    showPhotoStatus('');
    previewImg.src = URL.createObjectURL(file);
    previewWrap.style.display = 'flex';
    selectedAvisPhotoBlob = await resizeAvisPhoto(file);
    // Garde-fou : si le redimensionnement échoue et retombe sur le fichier original,
    // on revérifie la taille (le fichier original a déjà passé le test ci-dessus, mais
    // on reste défensif si resizeAvisPhoto renvoyait un jour un blob plus lourd).
    if (selectedAvisPhotoBlob && selectedAvisPhotoBlob.size > AVIS_PHOTO_MAX_BYTES) {
      showPhotoStatus(t('avisPhotoTooLarge'), true);
      photoInput.value = '';
      selectedAvisPhotoBlob = null;
      previewWrap.style.display = 'none';
    }
  };
  removeBtn.onclick = () => {
    photoInput.value = '';
    selectedAvisPhotoBlob = null;
    previewWrap.style.display = 'none';
    showPhotoStatus('');
  };
  document.getElementById('avisSubmitBtn').onclick = () => submitAvis(p);
}
async function submitAvis(p) {
  if (!FIREBASE_ENABLED || !currentUser) return;
  if (!selectedNote) { alert(t('avisNoteRequired')); return; }
  const commentaire = document.getElementById('avisTextarea').value.trim().slice(0, 500);
  const pseudo = (currentUser.email || '').split('@')[0];
  const ref = db.collection('avis').doc(slugId(p.nom));
  const submitBtn = document.getElementById('avisSubmitBtn');
  const photoBlob = selectedAvisPhotoBlob;
  let photoUrl = null, photoFailed = false, photoUnavailable = false;
  try {
    if (photoBlob) {
      if (!storage) {
        // Firebase Storage indisponible (non provisionné sur ce projet, par ex.) :
        // on dégrade proprement, l'avis part sans photo plutôt que de bloquer l'envoi.
        photoFailed = true;
        photoUnavailable = true;
      } else {
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('avisUploading'); }
        try {
          const path = `avis-photos/${slugId(p.nom)}/${currentUser.uid}_${Date.now()}.jpg`;
          const snap = await storage.ref(path).put(photoBlob);
          photoUrl = await snap.ref.getDownloadURL();
        } catch (e) {
          console.warn('Upload de la photo d\'avis échoué :', e);
          photoFailed = true;
        }
      }
    }
    const doc = await ref.get();
    const entries = (doc.exists && doc.data().entries) || [];
    const isNewReview = !entries.some(e => e.uid === currentUser.uid);
    const isFirstOnPlace = entries.length === 0;
    const filtered = entries.filter(e => e.uid !== currentUser.uid);
    const entry = { uid: currentUser.uid, pseudo, note: selectedNote, commentaire, date: Date.now() };
    if (photoUrl) entry.photoUrl = photoUrl;
    filtered.push(entry);
    await ref.set({ entries: filtered });
    document.getElementById('avisFormBox').innerHTML = `<p class="step-sub">${t('avisSuccess')}</p>${photoFailed ? `<p class="step-sub">${t(photoUnavailable ? 'avisPhotoUnavailable' : 'avisPhotoUploadError')}</p>` : ''}`;
    loadAvis(p);
    // Points de contribution : uniquement sur un nouvel avis (pas une modification), jamais bloquant.
    // Les deux bonus (1er avis du lieu, photo jointe) se cumulent.
    if (isNewReview) {
      const hasPhoto = !!photoUrl;
      const delta = 5 + (isFirstOnPlace ? 5 : 0) + (hasPhoto ? 5 : 0);
      awardPoints(currentUser.uid, delta);
    }
  } catch (e) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = t('avisSubmit'); }
    alert(t('avisError'));
  }
}

// Valide les champs obligatoires côté client et renvoie soit les données
// prêtes à écrire, soit null si un champ manque (l'appelant affiche alors
// proposeMissingFields — jamais d'alert()).
function proposeValidate() {
  const nom = document.getElementById('propNom').value.trim();
  const tKey = document.getElementById('propT').value;
  const zKey = document.getElementById('propZ').value;
  const typeKey = document.getElementById('propType').value;
  const desc = document.getElementById('propDesc').value.trim();
  const budgetEl = document.querySelector('#propBudget .chip-opt.sel');
  const dureeEl = document.querySelector('#propDuree .chip-opt.sel');
  const lat = parseFloat(document.getElementById('propLat').value);
  const lng = parseFloat(document.getElementById('propLng').value);
  if (!nom || !tKey || !zKey || !typeKey || !proposeSelV.length || !desc || !budgetEl || !dureeEl
    || !Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  return {
    nom, t: tKey, z: zKey, typeKey, v: proposeSelV.slice(), desc: desc.slice(0, 400),
    budget: budgetEl.dataset.k, duree: dureeEl.dataset.k,
    conseils: document.getElementById('propConseils').value.trim().slice(0, 300) || null,
    lat, lng,
  };
}

async function submitProposition(overlay) {
  if (!FIREBASE_ENABLED || !currentUser) return;
  const errEl = document.getElementById('propError');
  errEl.style.display = 'none';
  const data = proposeValidate();
  if (!data) {
    errEl.textContent = t('proposeMissingFields');
    errEl.style.display = 'block';
    return;
  }
  const submitBtn = document.getElementById('propSubmitBtn');
  const photoBlob = proposePhotoBlob;
  let photoUrl = null, photoFailed = false;
  if (submitBtn) submitBtn.disabled = true;
  try {
    if (photoBlob) {
      if (!storage) {
        // Storage indisponible : on dégrade proprement, la proposition part
        // sans photo plutôt que de bloquer tout l'envoi.
        photoFailed = true;
      } else {
        try {
          const path = `propositions-photos/${currentUser.uid}_${Date.now()}.jpg`;
          const snap = await storage.ref(path).put(photoBlob);
          photoUrl = await snap.ref.getDownloadURL();
        } catch (e) {
          console.warn('Upload de la photo de proposition échoué :', e);
          photoFailed = true;
        }
      }
    }
    const doc = {
      nom: data.nom, t: data.t, z: data.z, typeKey: data.typeKey, v: data.v,
      desc: data.desc, budget: data.budget, duree: data.duree, lat: data.lat, lng: data.lng,
      uid: currentUser.uid, pseudo: (currentUser.email || '').split('@')[0],
      status: 'pending', date: Date.now(),
    };
    if (data.conseils) doc.conseils = data.conseils;
    if (photoUrl) doc.photoUrl = photoUrl;
    await db.collection('propositions').add(doc);
    const modalEl = overlay.querySelector('.modal');
    if (modalEl) {
      modalEl.innerHTML = `
        <div class="modal-head"><h3>${t('proposeTitle')}</h3><button class="modal-close" id="closePropose2">✕</button></div>
        <p class="step-sub">${t('proposeSuccess')}</p>
        ${photoFailed && photoBlob ? `<p class="step-sub">${t('avisPhotoUploadError')}</p>` : ''}
      `;
      const closeBtn2 = document.getElementById('closePropose2');
      if (closeBtn2) closeBtn2.onclick = () => overlay.remove();
    }
  } catch (e) {
    console.warn('Soumission de la proposition échouée :', e);
    if (submitBtn) submitBtn.disabled = false;
    errEl.textContent = t('proposeError');
    errEl.style.display = 'block';
    // Le contenu du formulaire reste rempli (on ne le réinitialise pas) afin
    // que l'utilisateur puisse simplement re-cliquer sur "Envoyer" pour
    // réessayer, sans ressaisir quoi que ce soit.
  }
}
