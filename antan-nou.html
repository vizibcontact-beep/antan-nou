<!-- Polices de la charte graphique officielle Antan Nou : Montserrat (titres/wordmark) + Nunito (texte courant) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@300;400&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- Charte graphique officielle Antan Nou ---- */
    --forest-teal:#093B36; --forest-teal-soft:#E1E9E6;
    --warm-orange:#F66620; --warm-orange-soft:#FDE1D0;
    --sun-yellow:#F8A411; --sun-yellow-soft:#FDECD1;
    --cream-bg:#F8F6ED;
    --font-display:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --ink:#1B1A2E; --muted:#736F8C;
    /* Couleurs d'action / UI ancrées sur la charte officielle */
    --indigo:var(--forest-teal); --indigo-soft:var(--forest-teal-soft);
    --accent:var(--forest-teal); --accent-soft:var(--forest-teal-soft);
    --coral:var(--warm-orange); --coral-soft:var(--warm-orange-soft);
    --gold:var(--sun-yellow); --gold-soft:var(--sun-yellow-soft);
    --sand:var(--cream-bg); --card:#FFFFFF; --line:#E7E3F0;
    /* Alias de marque conservés pour compatibilité avec la direction précédente */
    --brand-green:var(--forest-teal); --brand-green-soft:var(--forest-teal-soft);
    --brand-sun:var(--sun-yellow); --brand-sun-soft:var(--sun-yellow-soft);
    --brand-terracotta:var(--warm-orange); --brand-terracotta-soft:var(--warm-orange-soft);
    --brand-blue:#1D7FA6; --brand-blue-soft:#E1EFF4; /* accent tertiaire secondaire, non utilisé pour le logo/hero/CTA */
    --brand-cream:var(--cream-bg); --brand-ink:#1B1A2E;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; background:var(--cream-bg); color:var(--ink); font-family:var(--font-body); }
  #app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  /* Typographie de la charte : titres/boutons en Montserrat, texte courant en Nunito (hérité de body) */
  h1,h2,h3,h4,h5,h6,.step-title,.modal-head h3,.day-card h4,.results-head h2,.home-search-label,
  .home-section-title,.infos-pratiques h4,.postcard .name,.place .nom,.mini-card .info .nom,
  .map-popup .nom,.surprise-reveal .nom,.slot .what .nom,header .brand .name,.home-brand-tagline,
  .btn,.tab-btn .tab-label,.maps-btn,.geo-btn,.wordmark-svg text { font-family:var(--font-display); }

  header { padding:20px 20px 14px; }
  header .brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  header .brand { display:flex; align-items:center; gap:8px; }
  header .brand .wordmark-svg { display:block; }
  header .icon-row { display:flex; gap:8px; }
  .icon-btn { position:relative; width:38px; height:38px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; }
  .icon-btn .badge { position:absolute; top:-5px; right:-5px; background:var(--coral); color:white; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .offline-banner { background:#3a3a3a; color:white; font-size:12.5px; font-weight:600; text-align:center; padding:8px 16px; line-height:1.4; }
  .today-alerts { margin:0 20px 14px; padding:12px 14px; border-radius:16px; background:var(--gold-soft); border:1.5px solid var(--gold); }
  .today-alerts .alerts-title { margin:0 0 8px; font-size:12.5px; font-weight:800; color:var(--ink); }
  .today-alerts .alert-chip { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; margin:0 0 6px; cursor:default; }
  .today-alerts .alert-chip:last-child { margin-bottom:0; }
  .today-alerts .alert-chip.clickable { cursor:pointer; }
  .today-alerts .alert-chip.clickable:active { background:var(--accent-soft); }
  .today-alerts .alert-chip span { flex:1; }

  .modal-overlay { position:fixed; inset:0; background:rgba(27,26,46,.55); display:flex; align-items:flex-end; z-index:1000; }
  .modal { background:var(--sand); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:20px; max-height:88vh; overflow-y:auto; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3 { margin:0; font-size:17px; font-weight:800; }
  .modal-close { width:30px; height:30px; border-radius:50%; background:var(--card); border:1px solid var(--line); font-size:14px; cursor:pointer; }
  .photo-carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:14px; background:var(--line); aspect-ratio:16/9; margin-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .photo-carousel::-webkit-scrollbar { display:none; }
  .photo-carousel .photo-slide { flex:0 0 100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; }
  .photo-carousel .photo-slide img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo-dots { display:flex; justify-content:center; gap:5px; margin:8px 0 2px; }
  .photo-dots span { width:6px; height:6px; border-radius:50%; background:var(--line); }
  .photo-dots span.active { background:var(--indigo); }
  .day-card { background:var(--card); border-radius:16px; border:1px solid var(--line); padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(13,59,49,.06); }
  .day-card h4 { margin:0 0 10px; font-size:14px; font-weight:800; color:var(--indigo); }
  .slot { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .slot:first-of-type { border-top:none; }
  .slot .when { flex:0 0 76px; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding-top:2px; }
  .slot .what .nom { font-size:13.5px; font-weight:700; margin:0; }
  .slot .what .z { font-size:11.5px; color:var(--muted); margin:1px 0 0; }
  .prog-form .adv-group { margin-bottom:16px; }
  .num-row { display:flex; gap:8px; }
  .num-opt { flex:1; text-align:center; padding:10px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); font-weight:700; font-size:14px; cursor:pointer; }
  .num-opt.sel { background:var(--indigo); border-color:var(--indigo); color:white; }
  .stepper { display:flex; gap:6px; }
  .stepper .dot { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .stepper .dot.done { background:var(--accent); }
  .step-title { font-size:20px; font-weight:800; margin:14px 0 4px; letter-spacing:-.01em; }
  .step-sub { font-size:13px; color:var(--muted); margin:0; }

  main { flex:1; padding:6px 20px 100px; overflow-y:auto; }

  .postcard-grid { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .postcard { border-radius:18px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; border:2px solid transparent; color:white; position:relative; }
  .postcard .stamp { font-size:26px; }
  .stamp-ico { width:1.1em; height:1.1em; vertical-align:-0.15em; display:inline-block; }
  .postcard .stamp .stamp-ico { width:1em; height:1em; vertical-align:middle; }
  .postcard .name { font-weight:800; font-size:15px; }
  .postcard.sel { border-color:var(--ink); }
  .postcard.sel::after { content:"✓"; position:absolute; right:14px; top:50%; transform:translateY(-50%); width:22px; height:22px; background:white; color:var(--ink); border-radius:50%; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; }

  .pill-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .pill { font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); cursor:pointer; }
  .pill.sel { background:var(--accent); border-color:var(--accent); color:white; }

  .vibe-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .vibe { aspect-ratio:1; border-radius:16px; background:var(--card); border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:11px; font-weight:700; color:var(--muted); text-align:center; padding:4px; }
  .vibe .e { font-size:22px; }
  .vibe.sel { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .advanced-toggle { display:flex; align-items:center; justify-content:center; gap:6px; margin:20px 0 4px; padding:10px; border-radius:12px; border:1.5px dashed var(--line); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; }
  .advanced-panel { display:none; margin-top:14px; }
  .advanced-panel.open { display:block; }
  .adv-group { margin-bottom:16px; }
  .adv-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--muted); margin:0 0 8px; }
  .adv-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip-opt { font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); cursor:pointer; }
  .chip-opt.sel { background:var(--gold-soft); border-color:var(--gold); color:#8A6110; }

  .search-bar { display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; margin:14px 0 10px; }
  .search-bar input { border:none; outline:none; flex:1; font-size:14px; background:none; color:var(--ink); }
  .sort-row { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .sort-chip { flex:0 0 auto; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); color:var(--muted); cursor:pointer; white-space:nowrap; }
  .sort-chip.sel { background:var(--indigo); border-color:var(--indigo); color:white; }

  .results-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .results-head h2 { font-size:14px; margin:0; font-weight:800; }
  .results-head span { font-size:12px; color:var(--muted); }

  .view-toggle { display:flex; gap:6px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:4px; margin-bottom:12px; }
  .view-toggle button { flex:1; border:none; background:none; padding:8px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; }
  .view-toggle button.sel { background:var(--accent); color:white; }
  #mapView { border-radius:16px; overflow:hidden; border:1px solid var(--line); height:420px; margin-bottom:12px; background:var(--card); }
  .leaflet-popup-content { font-size:13px; }
  .map-popup .nom { font-weight:800; margin:0 0 4px; }
  .map-popup .open-btn { display:inline-block; margin-top:6px; font-size:11.5px; font-weight:800; color:white; background:var(--accent); padding:5px 10px; border-radius:999px; cursor:pointer; border:none; }

  .place { background:var(--card); border-radius:18px; border:1px solid var(--line); padding:16px; margin-bottom:12px; position:relative; box-shadow:0 1px 3px rgba(13,59,49,.06); }
  .place .tab { position:absolute; top:-1px; left:16px; background:var(--accent); color:white; font-size:10px; font-weight:800; padding:4px 10px; border-radius:0 0 8px 8px; letter-spacing:.03em; }
  .fav-btn { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:var(--sand); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; border:none; }
  .fav-btn.active { background:var(--coral-soft); }
  .place .nom { font-size:15.5px; font-weight:800; margin:14px 40px 2px 0; }
  .place .loc { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .place .desc { font-size:13px; line-height:1.45; margin:0 0 10px; color:#403C55; }
  .place .vibes { display:flex; gap:6px; flex-wrap:wrap; }
  .chip-vibe { font-size:10.5px; font-weight:700; background:var(--indigo-soft); color:var(--indigo); padding:3px 9px; border-radius:999px; }
  .chip-meta { font-size:10.5px; font-weight:700; background:var(--gold-soft); color:#8A6110; padding:3px 9px; border-radius:999px; }

  /* Carte résultat avec photo (placeCardHTML) : mise en page photo plein cadre,
     badges flottants, dégradé bas pour le nom/localisation. Les règles ci-dessous
     sont scopées à .place.pcard pour ne pas affecter les autres usages de .place
     (favoris, lieux débloqués, file d'attente admin) qui gardent la mise en page
     texte d'origine. */
  .place.pcard { padding:0; border:none; overflow:hidden; aspect-ratio:4/3; box-shadow:0 2px 8px rgba(13,59,49,.12); }
  .place.pcard .pcard-bg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:42px; background-size:cover; background-position:center; color:rgba(255,255,255,.85); transition:opacity .25s ease; }
  .place.pcard .pcard-badge-cat { position:absolute; bottom:10px; right:10px; z-index:2; max-width:calc(100% - 20px); background:rgba(255,255,255,.92); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:var(--ink); font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.15); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place.pcard .pcard-badge-comm { position:absolute; top:10px; left:10px; background:rgba(29,127,166,.88); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:#fff; font-size:10px; font-weight:800; padding:4px 10px; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .place.pcard .fav-btn { top:10px; right:10px; width:34px; height:34px; background:rgba(255,255,255,.3); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1.5px solid rgba(255,255,255,.55); box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .place.pcard .fav-btn.active { background:rgba(255,255,255,.85); }
  .place.pcard .pcard-overlay { position:absolute; left:0; right:0; bottom:0; padding:34px 12px 40px; background:linear-gradient(to top, rgba(0,0,0,.8), transparent 70%); }
  .place.pcard .pcard-nom { margin:0 0 2px; font-size:15.5px; font-weight:800; color:#fff; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .place.pcard .pcard-loc { margin:0 0 6px; font-size:11.5px; font-weight:700; color:rgba(255,255,255,.92); display:flex; align-items:center; gap:3px; }
  .place.pcard .pcard-chips { display:flex; gap:5px; flex-wrap:wrap; }
  .place.pcard .pcard-chips .chip-vibe, .place.pcard .pcard-chips .chip-meta { background:rgba(255,255,255,.22); color:#fff; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .maps-btn { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; color:white; background:var(--indigo); padding:6px 12px; border-radius:999px; text-decoration:none; margin-top:10px; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px; }
  .empty .e { font-size:34px; display:block; margin-bottom:10px; }

  nav.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; z-index:50; }
  .legal-footer { text-align:center; font-size:11.5px; color:var(--muted); margin:28px 0 8px; padding-bottom:4px; text-decoration:underline; cursor:pointer; }
  .btn { flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; text-align:center; }
  .btn-primary { background:var(--accent); color:white; }
  .btn-primary:disabled { background:var(--line); color:var(--muted); }

  /* ==================== Direction "test" : accueil éditoriale ==================== */
  .wizard-nav-row { display:flex; gap:10px; margin-top:22px; }

  nav.bottom-nav.tab-bar { padding:6px 4px; }
  .tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; padding:6px 2px; border-radius:12px; cursor:pointer; color:var(--muted); font-family:inherit; }
  .tab-btn .tab-icon { font-size:19px; line-height:1; }
  .tab-btn .tab-label { font-size:10px; font-weight:700; }
  .tab-btn.sel { color:var(--brand-green); }

  /* ==================== Mode Chasseur de Trésors ==================== */
  /* Identité visuelle dédiée (section 5 du cahier des charges) : construite
     à partir de la charte Antan Nou existante (forêt profonde + or du soleil)
     plutôt que des couleurs inédites, pour garder le lien avec la marque tout
     en créant une sous-identité plus sombre, contrastée et "carte au trésor"
     — sans tomber dans l'esthétique enfantine. Appliquée via [data-game-mode]
     sur <html>, posé/retiré à chaque bascule du toggle, uniquement sur les
     surfaces propres au jeu (nav, Grimoire, panneau de distance, toasts) :
     le reste de l'app garde sa charte claire habituelle. */
  :root {
    --game-bg:#0B2E29; --game-bg-2:#123F38; --game-card:#154A41;
    --game-text:#F8F6ED; --game-muted:#B9CFC8; --game-line:rgba(248,246,237,.14);
    --game-gold:var(--sun-yellow); --game-gold-soft:var(--sun-yellow-soft);
  }
  /* Nav basse mobile en Mode Chasseur : fond sombre, onglet actif doré. */
  .game-hud { display:none; align-items:center; gap:10px; margin:8px 16px 0; padding:8px 12px; background:var(--game-bg); color:var(--game-text); border:1px solid var(--game-line); border-radius:14px; cursor:pointer; font-family:inherit; }
  .game-hud .gh-level { font-size:12px; font-weight:800; color:var(--game-gold); white-space:nowrap; }

<script>
/* =========================================================================

   Antilles-Guyane, avec des filtres supplémentaires (budget, durée, moment,

// ==================== Wordmark "Antan Nou" (charte graphique officielle) ====================

// ce qui se fond naturellement avec le fond crème (--cream-bg) utilisé partout dans l'app.
function wordmarkSVG(opts) {
  opts = opts || {};
  const w = opts.width || 220;
  const h = Math.round(w * 627 / 960);
  return `<img class="wordmark-img" src="assets/logo-antan-nou.svg" alt="Antan Nou" width="${w}" height="${h}" style="width:${w}px;height:${h}px;object-fit:contain;display:block;">`;
}

  { key:"guadeloupe", label:"Guadeloupe", stamp:'<img class="stamp-ico" src="assets/papillon.svg" alt="" width="20" height="20">', grad:"linear-gradient(135deg,#1B6E63,#2E9C7F)", color:"#1B6E63", colorSoft:"#E3F2EE" },
  { key:"guyane", label:"Guyane", stamp:"🌳", grad:"linear-gradient(135deg,#2F5233,#4C7A44)", color:"#2F5233", colorSoft:"#E7EEE5" },
  { key:"saint-martin", label:"Saint-Martin", stamp:"🌴", grad:"linear-gradient(135deg,#1E6091,#2E8FBD)", color:"#1E6091", colorSoft:"#E5EFF6" },
  { key:"saint-barthelemy", label:"Saint-Barthélemy", shortLabel:"Saint-Barth", stamp:"⛵", grad:"linear-gradient(135deg,#8A4B6B,#BD6E92)", color:"#8A4B6B", colorSoft:"#F3E9EE" },
];

// ---- Thème dynamique selon le territoire sélectionné ----
function applyTerritoryTheme() {
  const terr = TERRITOIRES.find(t => t.key === selT);

  document.documentElement.style.setProperty('--accent-soft', terr ? terr.colorSoft : '#EDEBF7');
}

const ZONES = {
  martinique: ["Nord Caraïbe","Nord Atlantique","Centre","Sud"],
  guadeloupe: ["Sud Grande-Terre","Nord Grande-Terre","Sud Basse-Terre","Nord Basse-Terre","Région Pointoise","Les Saintes","Marie-Galante","La Désirade"],

let lang = localStorage.getItem('antan_nou_lang') || null;
function t(key) {
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.fr;
  return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.fr[key] !== undefined ? TRANSLATIONS.fr[key] : key);
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('antan_nou_lang', l); } catch(e){}
}
function openLangModal(forced) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'langOverlay';
  document.body.appendChild(overlay);
  if (!forced) overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${t('langPickerTitle')}</h3>${forced ? '' : '<button class="modal-close" id="closeLang">✕</button>'}</div>
    ${forced ? '' : `<p class="step-sub" style="margin-bottom:14px;">${t('langPickerSub')}</p>`}
    <div class="pill-wrap">${LANGS.map(l => `<div class="pill ${lang===l.key?'sel':''}" data-lang="${l.key}" style="font-size:15px; padding:12px 18px;">${l.flag} ${l.label}</div>`).join('')}</div>
  </div>`;
  if (!forced) document.getElementById('closeLang').onclick = () => overlay.remove();
  overlay.querySelectorAll('[data-lang]').forEach(el => {
    el.onclick = () => { setLang(el.dataset.lang); overlay.remove(); render(); };
  });
}

  { t:"martinique", z:"Nord Atlantique", nom:"Château Dubuc", v:["culture","photo"], typeKey:"site_historique", desc:"Ruines d'une habitation du XVIIIe siècle au cœur de la Réserve naturelle de la Caravelle, avec vue sur l'océan.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:[], lat:14.7684837, lng:-60.8902548 },
  { t:"martinique", z:"Centre", nom:"Fort Desaix", v:["culture"], typeKey:"fort", desc:"Fortification du début du XIXe siècle dominant Fort-de-France, toujours occupée par l'armée, ouverte au public lors des Journées du Patrimoine.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.6163313, lng:-61.0657389 },
  { t:"martinique", z:"Centre", nom:"Cathédrale Saint-Louis", v:["culture"], typeKey:"eglise_cathedrale", desc:"Cathédrale à l'architecture métallique unique en son genre, en plein centre de Fort-de-France.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.604148, lng:-61.0697439, evenement:{ debutMois:12, debutJour:1, finMois:12, finJour:24, labelKey:"evtChanteNwel" } },
  { t:"martinique", z:"Nord Atlantique", nom:"Phare de la Caravelle", v:["culture","nature","photo","randonnee"], typeKey:"phare", difficulte:2, desc:"Phare du XIXe siècle au bout de la presqu'île de la Caravelle, accessible par un sentier de randonnée avec vue à 360°.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.7723175, lng:-60.8818206 },
  { t:"martinique", z:"Nord Atlantique", nom:"Instapoint Ailes (Tartane)", v:["photo","culture","nature"], typeKey:"spot_photo", desc:"Installation en forme d'ailes à l'entrée de Tartane, imaginée par l'association Valorisation Martinique pour sensibiliser à la protection du trembleur, oiseau endémique de la Caravelle.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.7720, lng:-60.9200 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Pont suspendu de Grand'Rivière", v:["photo","nature","sport","randonnee"], typeKey:"pont_suspendu", difficulte:3, desc:"Passerelle suspendue en bois et métal enjambant la forêt tropicale, sur le sentier entre Grand'Rivière et Anse Couleuvre, l'un des spots photo de l'association Valorisation Martinique.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.8702966, lng:-61.1658591 },
  { t:"martinique", z:"Sud", nom:"Morne Larcher", v:["photo","nature","sport","randonnee"], typeKey:"point_de_vue", difficulte:3, desc:"Randonnée derrière le Diamant offrant un point de vue panoramique à 360° sur le sud de l'île et le Rocher du Diamant.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.4634383, lng:-61.0559177 },
  { t:"martinique", z:"Sud", nom:"Ponton des Anses-d'Arlet", v:["photo","culture"], typeKey:"spot_photo", desc:"Ponton face à la petite église du village, l'un des sites les plus photographiés de Martinique.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["poussette"], lat:14.4903271, lng:-61.0809277 },
  { t:"martinique", z:"Sud", nom:"Nid de l'Anse Michel", v:["photo","plage","famille"], typeKey:"spot_photo", desc:"Grand nid d'oiseau géant installé par l'association Valorisation Martinique face à la plage de l'Anse Michel et sa barrière de corail, à Sainte-Anne.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.4368441, lng:-60.8263142 },
  { t:"martinique", z:"Sud", nom:"Balançoire du Diamant", v:["photo","plage"], typeKey:"spot_photo", desc:"Balançoire installée face à la plage et au Rocher du Diamant, un des spots photo les plus prisés du sud.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.4750, lng:-61.0250 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Marché couvert de Saint-Pierre", v:["manger","culture","shopping"], typeKey:"marche", desc:"Marché couvert du centre-ville de Saint-Pierre, où se vendent fruits, légumes et épices locales dans une halle typique.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.74193669, lng:-61.1763756 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Château Depaz", v:["culture","manger"], typeKey:"distillerie", desc:"Distillerie et château créole au pied de la Montagne Pelée, domaine historique de la famille Depaz entouré de champs de canne à sucre.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:[], lat:14.7507868, lng:-61.168937 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Mémorial de la catastrophe de 1902 – Musée Frank A. Perret", v:["culture"], typeKey:"musee", desc:"Musée vulcanologique de Saint-Pierre consacré à l'éruption de la Montagne Pelée en 1902, objets fondus et récits de la ville détruite.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.746877, lng:-61.17652 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Ruines du Théâtre de Saint-Pierre", v:["culture","photo"], typeKey:"site_historique", desc:"Vestiges du théâtre à l'italienne de Saint-Pierre, détruit par l'éruption de 1902, l'un des sites emblématiques de l'ancienne capitale.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.74687026, lng:-61.1760688 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Ruines de l'Église du Fort", v:["culture","photo"], typeKey:"site_historique", desc:"Ruines d'une église du XVIIe siècle à Saint-Pierre, murs et clocher restés debout après l'éruption de 1902.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.75060409, lng:-61.1786249 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Centre de découverte des sciences de la Terre", v:["culture","famille"], typeKey:"musee", desc:"Espace pédagogique de l'Habitation Périnelle à Saint-Pierre consacré à la volcanologie et aux risques naturels de la Martinique.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.754911, lng:-61.178967 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Centre d'interprétation du patrimoine Paul Gauguin", v:["culture"], typeKey:"musee", desc:"Centre dédié au séjour du peintre Paul Gauguin au Carbet en 1887, à l'Anse Turin où il vécut et peignit plusieurs toiles.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.72853017, lng:-61.1798181 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Pitons du Carbet", v:["nature","sport","randonnee"], typeKey:"sentier", difficulte:5, desc:"Massif volcanique aux cinq sommets boisés dominant la côte caraïbe, randonnée exigeante réservée aux marcheurs expérimentés.", budget:"gratuit", duree:"journee", moment:"jour", acces:[], lat:14.7052194, lng:-61.134494 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Anse Céron", v:["plage","nature"], typeKey:"plage", desc:"Plage sauvage de sable noir bordée de cocotiers au Prêcheur, point de départ du sentier vers l'Anse Couleuvre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.8334399, lng:-61.224283 },
  { t:"martinique", z:"Centre", nom:"Batterie Sainte-Catherine", v:["culture","photo"], typeKey:"site_archeologique", desc:"Ruines d'une ancienne batterie de défense côtière à Schœlcher, vestiges militaires face à la mer des Caraïbes.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.6123175, lng:-61.098862 },
  { t:"martinique", z:"Centre", nom:"Cascade An Ba Sô", v:["riviere","nature","randonnee"], typeKey:"cascade", difficulte:2, desc:"Cascade nichée dans le quartier Fond Lahaye à Schœlcher, accessible par un sentier en sous-bois.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.6496663, lng:-61.10335 },
  { t:"martinique", z:"Sud", nom:"Point de vue du Morne Gommier", v:["nature","photo","randonnee"], typeKey:"point_de_vue", difficulte:1, desc:"Panorama à 360° sur la baie du Marin et le sud de la Martinique depuis le sommet du Morne Gommier.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.4752916, lng:-60.865976 },
  { t:"martinique", z:"Sud", nom:"Plage de Dizac", v:["plage","photo"], typeKey:"plage", desc:"Longue plage de sable noir au Diamant, face au Rocher du Diamant, appréciée pour sa houle atlantique.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.4776073, lng:-61.026186 },
  { t:"martinique", z:"Sud", nom:"Anse à l'Âne", v:["plage","famille"], typeKey:"plage", desc:"Plage familiale des Trois-Îlets à l'eau calme, bordée de restaurants et accessible par la navette maritime depuis Fort-de-France.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:["poussette"], lat:14.539957, lng:-61.06593 },
  { t:"martinique", z:"Sud", nom:"Mangofil", v:["activites","famille","sport"], typeKey:"parc", desc:"Parcours accrobranche dans la forêt Rateau aux Trois-Îlets, tyroliennes et ponts suspendus entre les arbres pour petits et grands.", budget:"premium", duree:"demi-journee", moment:"jour", acces:[], lat:14.5288349, lng:-61.035491 },
  { t:"martinique", z:"Nord Atlantique", nom:"Habitation Saint-Étienne", v:["culture","nature"], typeKey:"distillerie", desc:"Distillerie de rhum HSE à Gros-Morne, jardin remarquable et bâtiments créoles à découvrir en visite libre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.690296, lng:-61.0136098 },
  { t:"martinique", z:"Nord Atlantique", nom:"Temple hindou de Fourniols", v:["culture"], typeKey:"eglise_cathedrale", desc:"Temple tamoul du quartier Fourniols à Sainte-Marie, témoin de l'héritage indien en Martinique.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.7689956, lng:-61.0104268 },
  { t:"martinique", z:"Nord Atlantique", nom:"Anse L'Étang", v:["plage","sport"], typeKey:"plage", desc:"Plage sauvage de la côte atlantique à Tartane, spot prisé des surfeurs et bodyboarders.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.7661939, lng:-60.904451 },
  { t:"martinique", z:"Nord Caraïbe", nom:"Anse Lévrier", v:["plage","nature","randonnee"], typeKey:"plage", difficulte:2, desc:"Petite plage de sable noir bordée de falaises, sans aménagement, dans le nord de la côte caraïbe, au Prêcheur. On l'atteint à pied par un sentier ONF au départ du parking de l'Anse Couleuvre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.84556, lng:-61.21824, conseils:"Sentier étroit avec montées et descentes et passage de rivière : chaussures fermées. Pas de poste de secours ; houle du nord parfois forte, baignade déconseillée aux jeunes enfants. Coordonnées issues d'une seule base de randonnée, recoupées avec le tracé du sentier." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Anse à Voile", v:["plage","nature","randonnee"], typeKey:"plage", difficulte:2, desc:"Plage sauvage de sable noir riche en fer volcanique, peu fréquentée, au bout d'un sentier ONF d'environ 20 minutes depuis le parking de l'Anse Couleuvre. Elle se visite souvent en boucle avec l'Anse Lévrier.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.84723, lng:-61.21558, conseils:"Attention aux mancenilliers (fruits et sève toxiques) : ne pas s'abriter dessous en cas de pluie. Houle parfois violente, pas de poste de secours ni de commerces : prévoir eau et provisions. Coordonnées issues d'une seule base de randonnée, recoupées avec le tracé du sentier." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Anse Turin", v:["plage","culture","famille"], typeKey:"plage", desc:"Plage de sable volcanique noir au pied de la montagne Pelée, associée au séjour de Paul Gauguin en Martinique et, selon la tradition, au débarquement de Christophe Colomb en 1502. Parking, douches et sanitaires sur place.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.7286, lng:-61.18010, conseils:"Courants et fond qui descend vite : prudence pour les enfants et nageurs peu expérimentés. Très fréquentée le week-end ; peu d'ombre. Le musée Paul Gauguin est à proximité." },
  { t:"martinique", z:"Nord Atlantique", nom:"Plage de Sinaï", v:["plage","nature","photo"], typeKey:"plage", desc:"Petite plage de sable noir au pied des hautes falaises de Grand'Rivière, à gauche du port de pêche, avec une vue dégagée vers la Dominique par temps clair.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.87179, lng:-61.18264, conseils:"Courants parfois forts et fond qui descend vite : peu adaptée aux enfants et aux nageurs débutants. Stationnement limité (environ 3 minutes de marche), pas de poste de secours, très peu d'ombre." },
  { t:"martinique", z:"Nord Atlantique", nom:"Plage des Raisiniers", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable fin à l'entrée de La Trinité, avec vue sur la baie et l'îlet Saint-Aubin. Stationnement sur place, douches et sanitaires, et petits restaurants à proximité.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.73623, lng:-60.95670, conseils:"Plage en bord de route, proche de la caserne des pompiers. Étape de la course du Tour des yoles rondes." },
  { t:"martinique", z:"Nord Atlantique", nom:"Plage de l'Autre Bord", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable fin presque blanc entre la pointe Batterie et l'anse des Raisiniers, à l'eau calme et peu profonde, avec des zones ombragées propices au pique-nique.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.74396, lng:-60.95279, conseils:"Plus calme en semaine, plus animée le week-end. Accès par la résidence « L'Autre Bord »." },
  { t:"martinique", z:"Nord Atlantique", nom:"Anse La Brèche", v:["plage","famille","nature"], typeKey:"plage", desc:"Plage de sable fin presque blanc en arc de cercle face à la baie de Tartane et à son îlet, bien ombragée. Elle a reçu le label « Tourisme et Handicap » et dispose de tables et d'un ponton accessible.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:["poussette"], lat:14.76569, lng:-60.91104, conseils:"Nombreux mancenilliers sur la plage (fruits et sève toxiques) : ne pas s'abriter ni toucher. Deux sources donnent des positions distantes d'environ 400 m ; point placé entre les deux." },
  { t:"martinique", z:"Nord Atlantique", nom:"Plage de Cosmy", v:["plage","famille","randonnee"], typeKey:"plage", desc:"Longue plage de sable doré de plus de 500 m, à l'eau calme et turquoise, ombragée par des cocotiers et raisiniers bord de mer. Tables, bancs et douches sur place ; départ du sentier Cosmy-Belle Étoile vers Sainte-Marie.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.75827, lng:-60.96723, conseils:"Agréable surtout le matin et hors vacances scolaires. Marina, étals de pêcheurs et restaurant à proximité." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Plage du Lido (Anse Collat)", v:["plage"], typeKey:"plage", desc:"Petite plage de sable gris bordée de cocotiers, au nord de Schœlcher en direction de Case-Pilote, accessible par une longue route en descente en cul-de-sac. Fréquentée surtout par les habitants.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.62184, lng:-61.10757, conseils:"Repérer le panneau « Anse Collat » sur la gauche de la route nationale ; la plage est en bas de la descente." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Plage de Madiana", v:["plage","famille","sport"], typeKey:"plage", desc:"Anse de sable gris aménagée dans le centre de Schœlcher, près du complexe de Madiana, avec cocotiers, parking, club nautique et terrain de beach-volley.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.61214, lng:-61.09880, conseils:"Plage urbaine plus animée le week-end. Petit restaurant directement sur la plage." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Anse Madame", v:["plage","famille","sport"], typeKey:"plage", desc:"Plage de sable gris au centre de Schœlcher, avec aire de jeux pour enfants et parcours de santé. Mer généralement calme, propice aux sports nautiques comme la voile ou le kayak.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.61723, lng:-61.10356, conseils:"Peu d'ombre ; plage urbaine, à côté du bourg." },
  { t:"martinique", z:"Sud", nom:"Pointe du Bout", v:["plage","famille","photo"], typeKey:"plage", desc:"Presqu'île touristique des Trois-Îlets avec de petites plages aménagées face à la baie de Fort-de-France, une marina, des restaurants et des boutiques. Belle vue sur la baie et sur Fort-de-France.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.55670, lng:-61.05223, conseils:"Les plages sont artificielles et situées au pied des hôtels : fréquentation forte en haute saison. Une navette maritime relie Fort-de-France à la Pointe du Bout." },
  { t:"martinique", z:"Sud", nom:"Anse Désert", v:["plage","nature"], typeKey:"plage", desc:"Plage de sable fin beige d'environ 230 m, bordée de végétation qui offre de l'ombre, dans le quartier Désert de Sainte-Luce, sur la côte caraïbe sud.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.46650, lng:-60.95200, conseils:"Stationnement interdit sur la plage même : se garer à proximité. Aucun poste de secours signalé ; fond qui descend progressivement." },
  { t:"martinique", z:"Sud", nom:"Anse Mabouya", v:["plage","famille"], typeKey:"plage", desc:"Plage tranquille de sable blond bordée de cocotiers et de raisiniers, avec vue sur le Rocher du Diamant et le morne Larcher. Eaux calmes et peu profondes.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.46900, lng:-60.95976, conseils:"Accès par la D7, via le quartier Désert (stationnement plus proche) ou Trois-Rivières. Pas de poste de secours ni de restaurant sur la plage. Deux sources donnent des positions distantes d'environ 400 m ; point placé entre les deux." },
  { t:"martinique", z:"Sud", nom:"Anse Fond Banane", v:["plage","nature"], typeKey:"plage", desc:"Petite plage discrète de sable blanc, ombragée par des cocotiers et des raisiniers, sur la route départementale D7 à l'ouest du bourg de Sainte-Luce.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.46670, lng:-60.94650, conseils:"Courants relativement importants : surveiller les enfants. Pas de sanitaires ni de poste de secours ; stationnement le long de la route. Les bases de données touristiques inversent parfois les positions de Fond Banane et de Corps de Garde." },
  { t:"martinique", z:"Sud", nom:"Anse Corps de Garde", v:["plage","famille","sport"], typeKey:"plage", desc:"Une des grandes plages de Sainte-Luce, de sable clair à l'eau généralement calme, avec une zone de baignade délimitée de type bassin marin pour les enfants. Grand parking, douches et sanitaires publics.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.46570, lng:-60.94200, conseils:"Baignade signalée comme surveillée ; plus calme en semaine. Bar et location de canoës sur place. Des piqûres dans le sable sont parfois signalées." },
  { t:"martinique", z:"Sud", nom:"Plage de Pont Café", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable fin d'environ 150 m bordée de cocotiers et de raisiniers, à Sainte-Luce, reliée à l'anse Corps de Garde par un sentier côtier. Eau calme, agréable pour la baignade et le snorkeling.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.46490, lng:-60.93860, conseils:"Parking ombragé gratuit, vite complet en haute saison. Algues sargasses possibles certains mois ; pas de poste de secours signalé." },
  { t:"martinique", z:"Sud", nom:"Anse Gros Raisin", v:["plage","famille"], typeKey:"plage", desc:"Deux plages successives de sable blond, séparées par une pointe rocheuse, bordées de cocotiers et de raisiniers. Tables de pique-nique et parc à proximité ; accessible à pied depuis le bourg de Sainte-Luce par un sentier côtier d'environ 10 minutes.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.46590, lng:-60.92590, conseils:"Eau généralement calme et claire. Plusieurs snacks et restaurants à proximité. Parking disponible près des plages." },
  { t:"martinique", z:"Sud", nom:"Pointe Borgnèse", v:["plage","nature"], typeKey:"plage", desc:"Petite plage cachée de sable fin à l'eau claire, entre Sainte-Luce et Le Marin, avec belle vue sur le sud de l'île. Fonds propices au snorkeling et vestiges de poterie et de fours à chaux dans la végétation.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.45345, lng:-60.90246, conseils:"Petit parking en bord de route (N5), puis courte marche sur un chemin pierreux et pentu. Site protégé par le Conservatoire du littoral, pêche interdite." },
  { t:"martinique", z:"Sud", nom:"Plage de la Pointe Marin", v:["plage","famille","sport"], typeKey:"plage", desc:"Longue plage de sable blanc de plus d'un kilomètre à Sainte-Anne, à l'eau calme et peu profonde, avec vue sur la baie et le Rocher du Diamant. Bars, restaurants et boutiques à proximité.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.44406, lng:-60.88190, conseils:"Baignade signalée comme surveillée ; parking payant à l'entrée. Très fréquentée le week-end." },
  { t:"martinique", z:"Sud", nom:"Anse Caritan", v:["plage","famille"], typeKey:"plage", desc:"Plage de Sainte-Anne indiquée comme adaptée aux familles avec enfants, face à un mouillage fréquenté par les voiliers.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.42662, lng:-60.88660, conseils:"Informations d'accès et d'équipements limitées : se renseigner sur place." },
  { t:"martinique", z:"Sud", nom:"Anse Meunier", v:["plage","nature"], typeKey:"plage", desc:"Plage sauvage d'environ 1 km de sable blanc et d'eau peu profonde, au sud de Sainte-Anne, bordée d'anciens marais salants et de mangrove.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.41769, lng:-60.89072, conseils:"Les 2 derniers km de piste sont en mauvais état, puis un court sentier jusqu'au rivage. Parking gratuit non surveillé, pas de poste de secours. Mancenilliers (troncs marqués de rouge) : ne pas s'en approcher ; sargasses et méduses possibles." },
  { t:"martinique", z:"Sud", nom:"Plage de Cap Macré", v:["plage","nature","randonnee"], typeKey:"plage", desc:"Plage sauvage de la côte atlantique du Marin, composée de deux petites criques de sable blanc entourées de végétation. Sert aussi de repère sur la Trace des Caps.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:14.47397, lng:-60.81361, conseils:"Accès par une route pierreuse parfois difficile. Pas d'infrastructures : prévoir eau et provisions (un snack est signalé à proximité). Algues possibles." },
  { t:"martinique", z:"Nord Atlantique", nom:"Distillerie J.M", v:["culture","manger","nature"], typeKey:"distillerie", desc:"Distillerie de rhum agricole du quartier Fonds Préville, à Macouba, au pied de la montagne Pelée. La visite comprend les champs de canne, la production, les chais, un jardin tropical et une dégustation.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:["interieur"], lat:14.86267, lng:-61.13607, conseils:"Vérifier les horaires et les formules de visite avant de partir." },
  { t:"martinique", z:"Sud", nom:"Maison de la Mangrove", v:["nature","famille","culture"], typeKey:"mangrove", desc:"Centre d'interprétation de la mangrove situé dans la forêt de Vatable, aux Trois-Îlets, géré avec le Parc naturel régional. Expositions interactives, point de vue et sentier d'environ 2,5 km en forêt littorale.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["interieur"], lat:14.53498, lng:-61.02622, conseils:"Entrée gratuite ; prévoir de l'eau et un répulsif pour le sentier." },
  { t:"martinique", z:"Nord Caraïbe", nom:"Habitation Céron", v:["culture","nature","photo"], typeKey:"habitation", desc:"Ancienne sucrerie du XVIIe siècle entre mer et rivière, au Prêcheur, avec un jardin tropical classé « Jardin remarquable » et un arbre pluvial de plus de 300 ans. Inscrite aux Monuments historiques.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:["interieur"], lat:14.83102, lng:-61.21969, conseils:"Proche de l'Anse Céron et de l'Anse Couleuvre ; on peut combiner la visite avec la plage." },
  { t:"martinique", z:"Sud", nom:"Mémorial Cap 110", v:["culture","photo"], typeKey:"site_historique", desc:"Mémorial de l'esclavage de l'Anse Caffard, au Diamant : quinze bustes en béton blanc disposés en triangle face à la mer, orientés vers le cap 110, en mémoire du naufrage d'un navire négrier en 1830. Œuvre de Laurent Valère.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:14.46432, lng:-61.04649, conseils:"Site en plein air avec vue sur le Rocher du Diamant ; la lumière du matin ou de fin de journée met les sculptures en valeur." },
  { t:"martinique", z:"Sud", nom:"Piton Crève-Cœur", v:["randonnee","nature","photo"], typeKey:"sentier", desc:"Petit piton volcanique de Sainte-Anne dominé par une table d'orientation, avec une boucle courte au départ des ruines de l'habitation Crève-Cœur. Panorama sur la baie du Marin et le sud de l'île.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], difficulte:2, lat:14.45206, lng:-60.85150, conseils:"Montée courte mais raide par endroits : chaussures fermées, eau et départ tôt pour éviter la chaleur." },
  { t:"martinique", z:"Sud", nom:"Boucle de Trou Cochon", v:["randonnee","nature","plage"], typeKey:"sentier", desc:"Boucle côtière d'environ 7 km au Vauclin, entre savane, mangrove, plage et forêt sèche, passant par l'Anse Simon, le village de pêcheurs de l'Anse Maroquet et la pointe du Vauclin.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], difficulte:1, lat:14.55190, lng:-60.83695, conseils:"Coordonnées du départ de la boucle (parking du quartier Château-Paille). Des échouements de sargasses peuvent rendre certains passages malodorants." },

  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Parc Aquacole", v:["nature","famille"], typeKey:"site_technique", desc:"Ferme aquacole de Pointe-Noire proposant une découverte de l'aquaculture durable.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:[], lat:16.223701, lng:-61.778791 },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Akropark", v:["sport","activites","famille"], typeKey:"parc_aventure", desc:"Parc accrobranche de Petit-Bourg, parcours pour grimper et se balancer d'arbre en arbre en pleine nature.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:[], lat:16.169389, lng:-61.629866 },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Le Tapeur", v:["sport","activites","famille"], typeKey:"parc_aventure", desc:"Parc aventure accrobranche de Bouillante, parcours dans la canopée près de la plage de Malendure.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:[], lat:16.179939, lng:-61.751511 },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"La Ferme Ti Bou", v:["famille","activites"], typeKey:"parc", desc:"Parc de loisirs familial de Petit-Bourg : piscine, jeux aquatiques, structures gonflables, karting à pédales et visite d'un parc animalier.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:["poussette"], lat:16.214843, lng:-61.596261 },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Bassin Bleu (Gourbeyre)", v:["nature","randonnee","famille"], typeKey:"riviere_bassin", difficulte:1, desc:"Bassin naturel et cascades en forêt tropicale, atteints par un sentier d'environ 1 km depuis le parking de la RD10 (Palmiste).", budget:"petit-budget", duree:"rapide", moment:"jour", acces:[], lat:16.01124, lng:-61.67126, conseils:"Coordonnées du départ du sentier. Chemin boueux et glissant par temps de pluie ; parking et baignade non surveillés. Entrée indiquée gratuite par le Parc national mais environ 5 € relevés ailleurs : à vérifier sur place." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Chute du Galion", v:["nature","randonnee","sport"], typeKey:"cascade", difficulte:2, desc:"Cascade de 40 m tombant dans une coulée de lave solidifiée au pied de la Soufrière, atteinte par un sentier de 3,9 km A/R depuis le parking des Bains Jaunes.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.03459, lng:-61.6701, conseils:"Coordonnées du départ (parking des Bains Jaunes). Traversées de rivière dangereuses par temps de pluie : ne pas partir si il a plu la veille ou si des orages sont annoncés. Parking et baignade non surveillés." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Bains Jaunes", v:["bienetre","nature"], typeKey:"source_chaude", desc:"Deux bassins d'eau tiède (environ 26 °C) alimentés par les pentes de la Soufrière, à environ 950 m d'altitude, près du départ des sentiers du volcan.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.03459, lng:-61.6701, conseils:"Ne pas immerger la tête (risque d'amibes) d'après l'affichage sur place. Parking gratuit d'une quinzaine de places, baignade non surveillée." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Cascade Paradis (Vieux-Habitants)", v:["nature","randonnee"], typeKey:"cascade", difficulte:2, desc:"Cascade tombant dans un bassin turquoise au pied de colonnes basaltiques, atteinte par un sentier de rivière d'environ 2 km depuis le parking.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.08874, lng:-61.721225, conseils:"Deux traversées de rivière dangereuses après la pluie : préférer la saison sèche, chaussures fermées. Risque de chute de pierres au pied de la cascade ; baignade non surveillée." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Saut de Bras de Fort", v:["nature","randonnee"], typeKey:"cascade", difficulte:2, desc:"Cascade et bassin naturel émeraude en pleine forêt, atteints par une marche d'environ 3 km A/R le long de la rivière.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.107826, lng:-61.596024, conseils:"Un passage glissant et un tronçon dans le lit de la rivière : éviter les jours de pluie (montée rapide des eaux)." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Cascade de Bis", v:["nature","randonnee","famille"], typeKey:"cascade", difficulte:2, desc:"Double cascade d'une dizaine de mètres, aussi appelée cascade de Petit Boucan, dans un bassin entouré de végétation, à environ 20 min de marche.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.279218, lng:-61.696352, conseils:"Descente argileuse avec cordes, très glissante après la pluie. Petit parking d'une dizaine de places : arrive tôt." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Cascade Tambour", v:["nature","randonnee"], typeKey:"cascade", difficulte:2, desc:"Cascade et bassin naturel en forêt tropicale à Petit-Bourg, atteints par une marche d'environ 3 km A/R avec plusieurs traversées de rivière.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.179187, lng:-61.643424, conseils:"Traversées de rivière sans pont, parfois jusqu'aux hanches : éviter en cas de pluie, chaussures antidérapantes." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Canyon de la Moustique", v:["nature","randonnee","sport"], typeKey:"riviere_bassin", difficulte:3, desc:"Randonnée aquatique dans un canyon étroit de la rivière Moustique : descente raide en forêt, traversée de rivière et passages à la nage de quelques minutes.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.15996, lng:-61.64063, conseils:"Coordonnées du parking de départ (boucle de Desbordes). Descente raide, sacs étanches indispensables, à éviter en saison des pluies." },
  { t:"guadeloupe", z:"Région Pointoise", nom:"Îlet du Gosier", v:["plage","nature","activites"], typeKey:"ilet_rocher", desc:"Petit îlot corallien d'environ 3 ha au large du Gosier : plage de sable, phare rouge et blanc, eaux propices au snorkeling.", budget:"petit-budget", duree:"demi-journee", moment:"jour", acces:[], lat:16.1991351, lng:-61.491343, tarif:"Navette depuis l'embarcadère du Gosier : environ 5 € par personne", conseils:"Évite les mancenilliers marqués d'une croix bleue : leur sève est toxique, ne t'abrite pas dessous en cas de pluie." },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Marches des Esclaves (Petit-Canal)", v:["culture"], typeKey:"site_historique", desc:"Escalier de pierre de 54 marches reliant l'ancien port à l'esplanade où se tenaient les ventes d'esclaves, chaque marche portant le nom d'un peuple africain.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.37906, lng:-61.492739 },
  { t:"guadeloupe", z:"La Désirade", nom:"Réserve naturelle de Petite-Terre", v:["nature","plage"], typeKey:"reserve_naturelle", desc:"Deux îlots inhabités (Terre-de-Haut et Terre-de-Bas), réserve naturelle depuis 1998, connus pour leurs plages, leurs tortues marines et la plus grande population d'iguanes des Antilles françaises.", budget:"premium", duree:"journee", moment:"jour", acces:[], lat:16.1731, lng:-61.1189, conseils:"Accessible uniquement en bateau (sorties encadrées) ; visite réglementée pour protéger la réserve." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Maison de la Forêt", v:["nature","famille","randonnee"], typeKey:"sentier", difficulte:1, desc:"Maison d'accueil du Parc national sur la route de la Traversée, départ d'une boucle d'1 km en forêt humide avec pont suspendu sur le Bras-David.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.176, lng:-61.6928, conseils:"Prudence sur la RD23, route très fréquentée. Pas de poubelles sur place, animaux interdits." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Saut des Trois Cornes", v:["nature","randonnee"], typeKey:"cascade", difficulte:2, desc:"Cascade où l'on peut se baigner, atteinte par une boucle forestière d'environ 3 km depuis la source sulfureuse de Sofaïa, à Sainte-Rose.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.292163, lng:-61.727131, conseils:"Coordonnées du parking de départ (Sofaïa). Sentier glissant par temps humide et traversée de rivière : ne pas partir s'il a plu la veille ou si du mauvais temps est annoncé." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Grand Cul-de-Sac Marin", v:["nature","activites"], typeKey:"mangrove", desc:"Vaste baie entre Basse-Terre et Grande-Terre abritant la plus grande mangrove intacte et le plus grand récif corallien des Petites Antilles, site Ramsar depuis 1993 et zone du Parc national.", budget:"petit-budget", duree:"journee", moment:"jour", acces:[], lat:16.34583, lng:-61.61722, conseils:"Coordonnées du centre du site. Zone protégée (réglementation de la pêche et des activités) : l'exploration se fait depuis le rivage ou en mer." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Domaine de Vanibel (Vieux-Habitants)", v:["culture","nature"], typeKey:"habitation", desc:"Plantation familiale de café arabica, vanille et bananes en agroforesterie à Vieux-Habitants, avec visite guidée et bonifierie du XIXe siècle restaurée.", budget:"petit-budget", duree:"rapide", moment:"jour", acces:[], lat:16.054646, lng:-61.732126, tarif:"7,50 € (visite guidée)", site:"https://www.vanibel.fr", conseils:"Visite guidée uniquement, à horaires fixes l'après-midi ; fermé le dimanche, les jours fériés et mi-juillet à mi-août. Appelle avant de venir (05 90 98 40 79)." },
  { t:"guadeloupe", z:"Région Pointoise", nom:"Église Saint-Pierre et Saint-Paul", v:["culture"], typeKey:"eglise_cathedrale", desc:"Église-cathédrale de Pointe-à-Pitre reconstruite après le séisme de 1843, remarquable par son ossature métallique anti-sismique, classée monument historique en 1978.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["interieur"], lat:16.238688, lng:-61.534563, conseils:"Des travaux de restauration de la structure métallique sont signalés : vérifie l'ouverture avant de venir." },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Distillerie Bellevue (Marie-Galante)", v:["culture","manger"], typeKey:"distillerie", desc:"Distillerie de rhum agricole fondée en 1769 à Marie-Galante, avec moulin à vent en activité, visite guidée des installations et dégustations.", budget:"gratuit", duree:"rapide", moment:"jour", acces:["interieur"], lat:15.9261355, lng:-61.2417903, site:"http://www.habitation-bellevue.com/", conseils:"Visite des installations de production selon la saison : hors campagne de récolte de la canne, l'usine peut être fermée." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Parc de la Source (Bouillante)", v:["nature","famille","randonnee"], typeKey:"parc", desc:"Parc agroforestier de 10 hectares ouvert en 2022 à Bouillante : sentiers, plantation de vanille, cascade de la Queue de Cheval et baignade en rivière.", budget:"premium", duree:"demi-journee", moment:"jour", acces:[], lat:16.150605, lng:-61.758304, tarif:"17,50 € adulte · 14 € (13-17 ans) · 10 € (6-12 ans) · gratuit -6 ans", site:"https://www.parcdelasource.com/", conseils:"Ouvert du mercredi au dimanche, 9h30-18h (dernières entrées à 16h-16h30), fermé le 1er janvier. Différent des sources chaudes de Bouillante." },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Anse de Mays", v:["plage","nature"], typeKey:"plage", desc:"Longue bande de sable blanc fin à l'écart des foules, eaux abritées et vue sur les montagnes de Basse-Terre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.9763, lng:-61.3176 },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de l'Anse Bambou", v:["plage","nature"], typeKey:"plage", desc:"Plage discrète et peu fréquentée de sable doré, vue sur la Guadeloupe, l'archipel des Saintes et l'îlet du Vieux-Fort.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.992125, lng:-61.2987, conseils:"Pas d'ombre aménagée ; galets au bord de l'eau, entre et sors de l'eau avec prudence." },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de Moustique", v:["plage","nature"], typeKey:"plage", desc:"Plage sauvage et peu fréquentée bordée de mancenilliers et de cocotiers, au nord-ouest de Saint-Louis. Idéale pour pique-niquer et nager.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.977811, lng:-61.308393, conseils:"Les mancenilliers (marqués en rouge) sont toxiques : ne t'abrite pas dessous et évite tout contact avec leur sève, feuilles ou fruits." },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de Vieux-Fort", v:["plage","nature"], typeKey:"plage", desc:"Plage de sable doré face à l'îlet du Vieux-Fort et à la mangrove, avec carbets, location de kayaks et de pédalos.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.987594, lng:-61.301787, conseils:"Baignade à surveiller : courants et rochers, surtout avec de jeunes enfants." },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de Folle Anse", v:["plage","nature","famille"], typeKey:"plage", desc:"Plage de sable blanc d'environ 2 km, eau peu profonde, bordée de mangrove et de la plus grande zone humide de Marie-Galante. Ponte des tortues imbriquées de juin à septembre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.949302, lng:-61.323359 },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de Grand-Bourg", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable doré bordée de cocotiers près du centre de Grand-Bourg, eau calme et peu profonde protégée par la barrière de corail. Carbets, aires de jeux, base nautique et camping.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:["poussette"], lat:15.878886, lng:-61.308051 },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de la Feuillère", v:["plage","activites"], typeKey:"plage", desc:"Lagon émeraude bordé de sable fin et de cocotiers, spot réputé de kitesurf et de windsurf. Restaurants et carbets directement sur la plage.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.888343, lng:-61.223086 },
  { t:"guadeloupe", z:"Marie-Galante", nom:"Plage de l'Anse Feuillard", v:["plage","nature"], typeKey:"plage", difficulte:2, desc:"Plage secrète de sable blanc dans un lagon protégé par la barrière de corail, accessible seulement à pied par un sentier de 15 à 20 minutes dans la végétation.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.932566, lng:-61.196109, conseils:"Aucun commerce sur place : apporte eau, provisions et parasol. Reste dans le lagon, les courants au-delà de la barrière de corail peuvent être dangereux." },
  { t:"guadeloupe", z:"Les Saintes", nom:"Plage du Pain de Sucre", v:["plage","nature"], typeKey:"plage", desc:"Crique isolée de sable blanc à l'eau très claire, au calme, réputée pour le snorkeling. Accessible à pied par un sentier ou en bateau.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.863511, lng:-61.598764 },
  { t:"guadeloupe", z:"Les Saintes", nom:"Anse Rodrigue", v:["plage","nature"], typeKey:"plage", desc:"Plage de sable blanc d'une centaine de mètres, nichée entre deux falaises sur la côte est de Terre-de-Haut. Eau turquoise, baignade et snorkeling ; petit snack et toilettes à proximité.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.858071, lng:-61.579529, conseils:"Environ 20 min de marche depuis le bourg, en longeant la piste de l'aérodrome puis la plage de Grande Anse. Les mancenilliers (rayés de rouge) sont toxiques : ne t'abrite pas dessous." },
  { t:"guadeloupe", z:"Les Saintes", nom:"Plage de Pompierre", v:["plage","famille","nature"], typeKey:"plage", desc:"Croissant de sable doré d'environ 800 m bordé de cocotiers, protégé des alizés par l'îlet Roches Percées. Eau turquoise calme et peu profonde, carbets avec tables pour pique-niquer.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.87209, lng:-61.571295, conseils:"Accessible à pied depuis le bourg. Baie protégée : l'entrée et le mouillage des bateaux à moteur et voiliers y sont interdits." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de Leroux", v:["plage","nature"], typeKey:"plage", desc:"Plage naturelle de sable doré à Ferry (Deshaies), eau claire et collines verdoyantes, à l'écart de la foule touristique.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.275446, lng:-61.804258 },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de Tillet", v:["plage","nature"], typeKey:"plage", desc:"Crique de sable roux fermée par une falaise, avec vue sur les îlets, sur la côte nord de Deshaies. Aucun commerce ni équipement sur place.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.350852, lng:-61.768186, conseils:"On y accède par un petit chemin sous-bois. Forte houle, courants puissants et risque de tourbillons possibles : baignade à aborder avec prudence." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de Gadet", v:["plage"], typeKey:"plage", desc:"Petite plage d'une centaine de mètres de sable doré à pente douce, entre la pointe Le Breton et Grande Anse. Eau calme et fréquentation modérée.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.32972, lng:-61.78722, conseils:"Accès par un escalier depuis le point de vue de Gadet ou par le sentier côtier." },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Trou à Man Louis", v:["plage","nature"], typeKey:"plage", desc:"Petite plage sauvage et peu fréquentée d'Anse-Bertrand, encadrée de falaises, eau turquoise cristalline propice à la baignade.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.4857098, lng:-61.4972739, conseils:"Aucun équipement ni commerce. Stationnement à environ 300 m, à rejoindre par un sentier piéton." },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Anse Colas", v:["plage","nature"], typeKey:"plage", desc:"Petite plage vierge d'environ 90 m, sable fin et eau turquoise, protégée de la houle avec une entrée dans l'eau très douce.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.4624, lng:-61.5228, conseils:"Aucune infrastructure ni restaurant à proximité (le plus proche à environ 1,5 km) : prévois eau et provisions." },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Plage de la Chapelle", v:["plage","sport"], typeKey:"plage", desc:"Plage de sable fin d'environ 760 m bordée de cocotiers et de raisiniers de bord de mer, parking proche. Fréquentée aussi par les surfeurs lors des houles du nord.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.47169, lng:-61.51294, conseils:"Plage non surveillée : le côté gauche convient à la baignade, le côté droit a de forts courants. Attention aux oursins et aux rochers." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de l'Anse des Îles", v:["plage","nature"], typeKey:"plage", desc:"Plage de sable ocre isolée au sud de Sainte-Rose, avec vue dégagée sur l'îlet Kahouanne, la Tête à l'Anglais et, par temps clair, Montserrat. Quelques arbres offrent un peu d'ombre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.356722, lng:-61.747164, conseils:"Peu d'équipements. Baignade à aborder avec prudence en raison des courants." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de Clugny", v:["plage","nature"], typeKey:"plage", desc:"Plage sauvage de sable doré entre Sainte-Rose et Deshaies, avec un peu d'ombre naturelle et vue sur l'îlet Kahouanne.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.354334, lng:-61.757233, conseils:"Courants parfois dangereux : baignade à surveiller." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage de Nogent", v:["plage","nature"], typeKey:"plage", desc:"Plage de sable ocre au sud de Sainte-Rose, protégée par des récifs coralliens, cadre tranquille et préservé.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.357901, lng:-61.737073, conseils:"Accès par un chemin de terre en zone résidentielle. Des rochers affleurent près du rivage : la baignade est meilleure vers l'extrémité droite de la plage." },
  { t:"guadeloupe", z:"Nord Basse-Terre", nom:"Plage des Amandiers", v:["plage","famille","randonnee"], typeKey:"plage", desc:"Plage d'environ 550 m ombragée par des amandiers et des cocotiers, avec carbets, douches, sanitaires et parking. Point de départ d'un sentier côtier vers la Pointe Allègre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.351631, lng:-61.723863, conseils:"Pas de barrière de corail : courants possibles, baignade plus sûre par temps calme." },
  { t:"guadeloupe", z:"Sud Grande-Terre", nom:"Grande Anse des Salines", v:["plage","nature"], typeKey:"plage", desc:"Étendue de sable blanc entre mer et marais, protégée par la barrière de corail, à Saint-François. Cadre paisible, idéal pour se détendre.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.253846, lng:-61.186252 },
  { t:"guadeloupe", z:"Sud Grande-Terre", nom:"Anse à la Gourde", v:["plage","famille","activites"], typeKey:"plage", desc:"Plage de sable blanc d'environ 1,2 km bordée de raisiniers et d'amandiers, lagon turquoise protégé par la barrière de corail, idéal pour le snorkeling. Carbets, parking gratuit, restaurants et food trucks à proximité.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.25792, lng:-61.21358, conseils:"Plage non surveillée : de forts courants peuvent se former malgré le lagon. Services complets uniquement au bourg de Saint-François." },
  { t:"guadeloupe", z:"Sud Grande-Terre", nom:"La Douche", v:["nature","plage","photo"], typeKey:"plage", desc:"Petits bassins naturels creusés dans le calcaire où les vagues viennent s'écraser en jets d'eau, sur le littoral de Saint-François.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.252946, lng:-61.22989, conseils:"Baignade limitée : fond rocheux avec des pointes coupantes, possible surtout à marée basse dans les petits bassins. Aucune surveillance." },
  { t:"guadeloupe", z:"Sud Grande-Terre", nom:"Plage des Raisins Clairs", v:["plage","famille","manger"], typeKey:"plage", desc:"Plage de sable fin ombragée par des arbres, mer calme et eau turquoise protégée par une barrière naturelle. Tables de pique-nique, parking attenant, food trucks et petits restaurants à proximité.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:["poussette"], lat:16.24686, lng:-61.285221 },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Plage de Malendure", v:["plage","activites","nature"], typeKey:"plage", desc:"Plage de sable gris volcanique face aux îlets Pigeon et à la réserve Cousteau, point de départ pour la plongée, le snorkeling et l'observation des tortues. Douches, sanitaires, snacks, location de kayaks et clubs de plongée sur place.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.171903, lng:-61.776445 },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Plage de Petite Anse (Bouillante)", v:["plage","nature"], typeKey:"plage", desc:"Petite plage de sable doré à l'eau claire, entourée de végétation et de rochers, loin de la foule. Baignade et snorkeling avec vue sur la mer des Caraïbes.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.09605, lng:-61.770652 },
  { t:"guadeloupe", z:"Région Pointoise", nom:"Plage de Petit-Havre", v:["plage","famille","sport"], typeKey:"plage", desc:"Plage de sable fin entre Le Gosier et Sainte-Anne, avec une zone abritée par la barrière de corail et une zone plus exposée prisée des surfeurs. Carbets, tables de pique-nique ombragées, snacks et petit parking public.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.209497, lng:-61.425685, conseils:"Baignade non surveillée en permanence. La baignade y a déjà été temporairement interdite pour qualité de l'eau : renseigne-toi avant de venir. Le parking est petit, arrive tôt." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Plage de Grande Anse (Trois-Rivières)", v:["plage","nature"], typeKey:"plage", desc:"Longue plage de sable noir volcanique de plus de 800 m bordée de cocotiers, avec vue sur l'archipel des Saintes. Carbets, tables de pique-nique et parking. Site de ponte des tortues marines (luth, verte), prisé des surfeurs et bodyboarders.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.958972, lng:-61.672465, conseils:"Baignade dangereuse (forts courants, vagues imprévisibles). Zone de ponte protégée : respecte les tortues et leurs traces." },
  { t:"guadeloupe", z:"Sud Basse-Terre", nom:"Plage de Rivière-Sens", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable noir volcanique au pied des Monts Caraïbes, près de la marina de Gourbeyre. Eau calme et chaude, douches, toilettes, terrain de volley, restaurants, snacks et supérette.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:15.980844, lng:-61.715508, conseils:"Le fond descend vite : prudence avec les enfants." },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Plage de l'Autre Bord", v:["plage","famille"], typeKey:"plage", desc:"Plage de sable doré à quelques minutes du centre du Moule, protégée par la barrière de corail (eau relativement calme). Sanitaires, zones ombragées et carbets.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.329643, lng:-61.340897 },
  { t:"guadeloupe", z:"Nord Grande-Terre", nom:"Plage de Babin", v:["nature","plage"], typeKey:"plage", desc:"Plage d'environ 300 m à la pointe Geffrier (Vieux-Bourg), au sable gris et à l'eau saumâtre bordée de mangrove. Vue sur le nord de la Basse-Terre et la mangrove, surtout fréquentée par les habitants.", budget:"gratuit", duree:"rapide", moment:"jour", acces:[], lat:16.3409, lng:-61.5263, conseils:"Pas de sable blanc ni d'eau turquoise ici. La baignade y a fait l'objet d'interdictions temporaires pour qualité de l'eau : renseigne-toi avant de venir." },
  { t:"guadeloupe", z:"Sud Grande-Terre", nom:"Plage du Helleux", v:["plage","sport","randonnee"], typeKey:"plage", desc:"Plage entre Sainte-Anne et Saint-François, connue pour le surf (cours proposés sur place) et point de départ de boucles de randonnée vers l'Anse à Jacques.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.242272, lng:-61.338543 },
  { t:"guadeloupe", z:"La Désirade", nom:"Plage de l'Anse du Souffleur (La Désirade)", v:["plage","famille","nature"], typeKey:"plage", desc:"Plage de sable doré bordée de cocotiers, eau peu profonde sur plusieurs mètres, poissons, coraux et parfois tortues. Cabanes en bois pour l'ombre et petites échoppes de spécialités créoles.", budget:"gratuit", duree:"demi-journee", moment:"jour", acces:[], lat:16.31029, lng:-61.044746, conseils:"Accès en voiture depuis Beauséjour, ou en bateau depuis Saint-François." },
